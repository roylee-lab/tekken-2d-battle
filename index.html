<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TEKKEN 2D BATTLE - GLOBAL CHAMPIONSHIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07060f; --panel: #141a3d; --gold: #ffd400; --text: #eef; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Do Hyeon", "Malgun Gothic", sans-serif; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc((100vh - 26px) * 16 / 9)); aspect-ratio: 16 / 9; max-height: 100vh; }
  body.touch #stage { width: min(100vw, calc((100vh - 150px) * 16 / 9)); }
  canvas#screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; box-shadow: 0 0 40px rgba(255, 140, 0, 0.15); }
  /* 로비 */
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 10, 0.55); }
  .hidden { display: none !important; }
  .panel { width: min(92%, 440px); background: linear-gradient(180deg, #1b2257, #0c1030); border: 3px solid var(--gold); box-shadow: 0 0 0 3px #000, 0 10px 40px rgba(0,0,0,.6); padding: 16px 18px; text-align: center; }
  .panel h2 { margin: 0 0 12px; font-family: "Black Han Sans", sans-serif; font-weight: 400; color: var(--gold); letter-spacing: 1px; text-shadow: 2px 2px 0 #7a1d00; font-size: clamp(18px, 3.2vw, 26px); }
  .panel button { font-family: "Black Han Sans", "Do Hyeon", sans-serif; font-size: clamp(14px, 2.2vw, 18px); color: #fff; background: #2b3a8f; border: 2px solid #000; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), 0 0 0 2px #6f86ff; padding: 9px 14px; margin: 5px 0; width: 100%; cursor: pointer; }
  .panel button:hover { background: #3a4fc0; }
  .panel button.lan { background: #0f7a45; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), 0 0 0 2px #4dffa0; }
  .panel .row { display: flex; gap: 8px; }
  .panel .row button { width: auto; flex: 0 0 auto; }
  .panel input { flex: 1; min-width: 0; font-family: "Press Start 2P", monospace; font-size: 16px; text-transform: uppercase; text-align: center; padding: 8px; margin: 5px 0; background: #050818; color: var(--gold); border: 2px solid #6f86ff; letter-spacing: 4px; }
  #netStatus { min-height: 48px; margin: 10px 0 6px; font-size: clamp(13px, 2vw, 16px); line-height: 1.45; color: #dfe6ff; }
  #netStatus .code { font-family: "Press Start 2P", monospace; color: var(--gold); font-size: 22px; letter-spacing: 6px; display: inline-block; margin: 6px 0; }
  .panel .sub { font-size: 12px; color: #9aa6d6; margin-top: 4px; }
  .panel button.back { background: #444; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), 0 0 0 2px #888; }
  /* 터치 버튼 */
  #touch { display: none; width: 100%; max-width: 900px; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); justify-content: space-between; align-items: center; gap: 8px; }
  body.touch #touch { display: flex; }
  .pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 40px); gap: 3px; }
  .tb { border: 2px solid #000; border-radius: 10px; color: #fff; font-family: "Black Han Sans", sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: center; background: #333a5a; box-shadow: inset 0 -3px 0 rgba(0,0,0,.4); touch-action: none; }
  .tb.on { filter: brightness(1.6); transform: translateY(2px); }
  .tb.up { grid-column: 2; grid-row: 1; } .tb.lf { grid-column: 1; grid-row: 2; } .tb.rt { grid-column: 3; grid-row: 2; } .tb.dn { grid-column: 2; grid-row: 3; }
  .acts { display: grid; grid-template-columns: repeat(4, 52px); grid-template-rows: repeat(2, 54px); gap: 5px; }
  .tb.p { background: #c0392b; } .tb.k { background: #d35400; } .tb.s1 { background: #2471a3; } .tb.s2 { background: #7d3c98; } .tb.s3 { background: #1e8449; } .tb.s4 { background: #b9770e; }
  .tb.st { background: #1e8449; font-size: 12px; } .tb.bk { background: #555; font-size: 12px; }
  @media (orientation: landscape) {
    body.touch #stage { width: min(100vw, calc(100vh * 16 / 9)); }
    body.touch #touch { position: fixed; left: 0; right: 0; bottom: 0; max-width: none; pointer-events: none; padding: 0 12px calc(8px + env(safe-area-inset-bottom)); }
    body.touch .pad, body.touch .acts { pointer-events: auto; opacity: 0.72; }
    body.touch .acts { grid-template-columns: repeat(4, 46px); grid-template-rows: repeat(2, 44px); }
    body.touch .pad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 36px); }
  }
  /* 계정 / 친구 */
  .panel.acc { max-height: 94%; overflow-y: auto; text-align: left; }
  .panel.acc h2 { text-align: center; }
  .panel.acc input { width: 100%; font-family: "Do Hyeon", sans-serif; font-size: 16px; letter-spacing: 0; text-transform: none; text-align: left; color: #fff; }
  .panel.acc .row input { width: auto; }
  .panel .mini { width: auto; display: inline-block; padding: 3px 9px; margin: 0 0 0 5px; font-size: 13px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
  .panel .mini.ok { background: #0f7a45; } .panel .mini.fight { background: #b7301e; } .panel .mini.x { background: #444; padding: 3px 7px; }
  .panel .mini:disabled { background: #333 !important; color: #777; cursor: default; }
  .acc .me { font-size: 17px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .acc .sec { margin: 12px 0 4px; color: var(--gold); font-family: "Black Han Sans", sans-serif; font-size: 15px; border-bottom: 1px solid #3a4a9a; padding-bottom: 3px; }
  .acc .fr { display: flex; justify-content: space-between; align-items: center; padding: 5px 2px; border-bottom: 1px dashed #2a356f; font-size: 16px; }
  .acc .fr small { color: #9aa6d6; margin-left: 6px; font-size: 12px; }
  .acc .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #666; margin-right: 4px; }
  .acc .dot.on { background: #3dff8a; box-shadow: 0 0 6px #3dff8a; } .acc .dot.busy { background: #ffb02e; }
  .acc .empty { color: #9aa6d6; padding: 8px 0; font-size: 14px; }
  .acc .wait { background: #3a1410; border: 1px solid #ff6b4a; padding: 8px; margin: 8px 0; font-size: 15px; }
  .acc .msg { margin-top: 10px; font-size: 14px; } .acc .msg.good { color: #7dff9a; } .acc .msg.bad { color: #ff8a8a; }
  #invitePop { position: absolute; top: 3%; left: 50%; transform: translateX(-50%); z-index: 20; background: linear-gradient(180deg, #5a1010, #2a0808); border: 3px solid var(--gold); box-shadow: 0 0 0 3px #000, 0 8px 30px rgba(0,0,0,.6); padding: 10px 14px; font-size: clamp(14px, 2vw, 18px); white-space: nowrap; animation: pop .3s ease-out; }
  #invitePop .mini { font-family: "Black Han Sans", sans-serif; color: #fff; border: 2px solid #000; background: #444; padding: 4px 12px; margin-left: 8px; cursor: pointer; }
  #invitePop .mini.ok { background: #0f7a45; }
  @keyframes pop { from { transform: translateX(-50%) scale(.7); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .hint { font-size: 12px; color: #889; text-align: center; padding: 4px; }
  body.touch .hint { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="screen" width="960" height="540"></canvas>
    <div id="invitePop" class="hidden"></div>
    <div id="account" class="overlay hidden">
      <div class="panel acc">
        <h2>👥 친구 대전</h2>
        <div id="accBody"></div>
        <button id="btnAccBack" class="back">◀ 뒤로</button>
      </div>
    </div>
    <div id="lobby" class="overlay hidden">
      <div class="panel">
        <h2>🌐 온라인 대전</h2>
        <button id="btnLan" class="lan">📶 같은 와이파이 자동 매칭</button>
        <div class="sub">같은 공유기(와이파이)에 연결된 친구와 버튼 하나로 연결</div>
        <button id="btnHost">🏠 방 만들기 (코드 생성)</button>
        <div class="row"><input id="roomInput" maxlength="4" placeholder="CODE" autocomplete="off"><button id="btnJoin">참가</button></div>
        <div id="netStatus"></div>
        <button id="btnLobbyBack" class="back">◀ 뒤로</button>
      </div>
    </div>
  </div>
  <div id="touch">
    <div class="pad">
      <div class="tb up" data-btn="U">▲</div><div class="tb lf" data-btn="L">◀</div><div class="tb rt" data-btn="R">▶</div><div class="tb dn" data-btn="D">가드</div>
    </div>
    <div class="acts">
      <div class="tb p" data-btn="P">펀치<br>S</div><div class="tb k" data-btn="K">킥<br>D</div><div class="tb st" data-btn="START">START</div><div class="tb bk" data-btn="BACK">BACK</div>
      <div class="tb s1" data-btn="S1">Q</div><div class="tb s2" data-btn="S2">W</div><div class="tb s3" data-btn="S3">E</div><div class="tb s4" data-btn="S4">R</div>
    </div>
  </div>
  <div class="hint">이동 ←→ · 점프 ↑ · 가드 ↓ (피해 70% 경감) · 펀치 S · 킥 D · 스킬 Q / W / E / R · 시작 SPACE · 뒤로/일시정지 ESC · BGM M</div>
</div>

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v < 0 ? -1 : 1);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shade(hex, amt) {
  // amt: -1(검정) ~ +1(흰색)
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map((x) => x + x).join('');
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function safeLS(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (e) { return null; }
  return null;
}
