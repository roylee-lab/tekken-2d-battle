  G.proj = []; G.traps = []; G.freezeT = 0; G.hitStop = 0; G.dice = null; G.notes = []; G.flash = 0;
  G.rw = -1; G.koType = ''; G.perfect = false;
  for (const F of G.F) {
    const wins = F.wins, c = F.c, side = F.side;
    Object.assign(F, makeFighter(side, c));
    F.wins = wins;
    const O = G.F[1 - side];
    // 이은뚱 패시브: 상대가 mola/JJjin이면 최대 체력 +10
    F.maxHp = BAL[c].hp + (c === 4 && (O.c === 1 || O.c === 2) ? Math.round(BAL[4].hp * BAL[4].friend) : 0);
    F.hp = F.maxHp;
    F.cd = SLOT_CD_START.map((s) => s * SEC);   // 라운드 시작 시 첫 쿨타임부터 돈다
    F.x = ARENA_W / 2 + (side === 0 ? -80 : 80);
    F.f = side === 0 ? 1 : -1;
  }
}

// ---------- 이벤트/알림 ----------
function ev(G, ...a) { G.ev.push(a); }
function note(G, text, color, life) { G.notes.push({ t: text, c: color || '#fff', life: life || 100, max: life || 100 }); if (G.notes.length > 4) G.notes.shift(); }

// ---------- 은맘: 피해·방해효과 대신 받기 ----------
function momAlive(F) { return F.momHp > 0 && F.momT > 0; }
function momTake(G, F, dmg, label) {
  F.momHp -= dmg;
  ev(G, 'spark', F.x - F.f * 20, F.y + 45, 'guard');
  ev(G, 'float', F.x - F.f * 20, F.y + 92, label || ('-' + (Math.round(dmg * 10) / 10)), '#ffb3d1');
  if (F.momHp <= 0) { F.momHp = 0; F.momT = 0; note(G, '은맘이 쓰러졌다!', '#ff8fb3', 80); ev(G, 'sfx', 'clash'); }
}
// 구속·감속·봉인 같은 방해효과를 받기 전에 호출 → true면 은맘이 대신 받아서 무효
function disrupt(G, T) {
  if (!momAlive(T)) return false;
  momTake(G, T, 0, '방해 무효!');
  return true;
}

// ---------- 데미지 처리 ----------
function applyDamage(G, A, D, dmg, type, o) {
  o = o || {};
  if (D.ko) return 'immune';
  if (A && A !== D && A.curseT > 0 && !o.reflect) dmg *= 1 + BAL[4].curseAtk;   // 31.8의 저주: 공격력 증가
  const proj = PROJ_TYPES.has(type);
  const hy = D.y + 50 * lookOf(D).H;
  // 1. 힙찔 강 보드: 공격 1회 완전 방어 후 파괴
  if (D.board) {
    D.board = false; if (D.c === 8) D.cd[1] = SLOT_CD[1] * SEC;
    ev(G, 'sfx', 'parry'); ev(G, 'shake', 8, 4); ev(G, 'spark', D.x, hy, 'guard');
    note(G, `${charName(D.c)}의 보드가 공격을 막고 부서졌다!`, '#ff66b3', 80);
    return 'immune';
  }
  // 2. 정의(正義) 발동 중: 모든 공격 무효
  if (D.jeongA > 0) { ev(G, 'spark', D.x, hy, 'immune'); ev(G, 'sfx', 'immune'); return 'immune'; }
  // 3. 안거녕 패시브: 투사체 무적
  if (D.c === 6 && proj) { ev(G, 'spark', D.x, hy, 'immune'); ev(G, 'sfx', 'immune'); ev(G, 'float', D.x, hy + 20, '무효!', '#ffd27f'); return 'immune'; }
  // 4. 먹부림: 무적
  if (D.meokT > 0) { ev(G, 'spark', D.x, hy, 'immune'); ev(G, 'sfx', 'chomp'); return 'immune'; }
  // 5. 만물포용력: 데미지 → 회복
  if (D.manT > 0) {
    if (dmg > 0) { D.hp = Math.min(D.maxHp, D.hp + dmg); ev(G, 'heal', D.x, hy); ev(G, 'float', D.x, hy + 20, '+' + Math.round(dmg), '#7dff9a'); }
    return 'immune';
  }
  // 6. 패링
  if (D.parryT > 0) {
    ev(G, 'sfx', 'parry'); ev(G, 'shake', 10, 5); ev(G, 'spark', D.x, hy, 'parry');
    if (!proj) { A.kb = -A.f * 7; A.hitT = Math.max(A.hitT, 14); }
    note(G, 'PARRY!', '#7fd4ff', 45);
    return 'parry';
  }
  // 7. Tirón 괴룡 패시브
  if (D.c === TIRON) {
    D.pain++;
    if (D.pain >= BAL[11].painMax) {
      D.pain = 0; if (!disrupt(G, A)) A.rootT = Math.max(A.rootT, BAL[11].painRoot);
      note(G, `⚡ Tirón 괴룡 패시브 발동! 적 ${BAL[11].painRoot / 60}초 구속! ⚡`, '#ff9f43', 90); ev(G, 'shake', 12, 6); ev(G, 'sfx', 'roar');
    }
  }
  // 8. 가드: 70% 경감 (독 폭발/고정 피해는 가드 무시)
  let blocked = false;
  if (D.guard && D.guardOffT <= 0 && type !== 'TOXIC_EXPLOSION' && !o.fixed) {
    dmg *= 0.3; blocked = true;
  }
  // 9. 경감 효과 (고정 피해는 무시)
  // 31.8의 저주: 받은 피해 일부 반사 (고정 피해)
  if (D.curseT > 0 && !o.reflect && A !== D && dmg > 0) {
    const refl = dmg * BAL[4].curseRefl;
    applyDamage(G, D, A, refl, 'REFLECT', { fixed: true, reflect: true });
  }
  if (!o.fixed) {
    if (D.curseT > 0) dmg *= 1 - BAL[4].curseDR;
    if (D.c === 8 && A.c !== 8) dmg *= 1 - BAL[8].dr;      // 힙찔 강 불협화음 (받는 피해 10% 감소)
    if (D.spikeT > 0) dmg *= 1 - BAL[12].spikeDR;                // 힌참휴 뾰족한 머리 (받는 피해 10% 감소)
  }
  // 은맘이 피해와 방해효과를 모두 대신 받음
  if (momAlive(D)) {
    if (dmg > 0) momTake(G, D, dmg); else momTake(G, D, 0, '막음!');
    return 'mom';
  }
  if (dmg > 0) {
    D.hp -= dmg;
    ev(G, 'float', D.x + rnd() * 10 - 5, hy + 22, (Math.round(dmg * 10) / 10).toString(), blocked ? '#bbbbbb' : (o.fixed ? '#ff5edb' : '#ffe14d'));
    if (A !== D && A.stimT > 0) { A.hp = Math.min(A.maxHp, A.hp + dmg * BAL[0].stimLS); ev(G, 'heal', A.x, A.y + 50); }
    if (A.c === 3 && A !== D) { const red = Math.round(BAL[3].cdRed * SEC); A.cd = A.cd.map((v) => Math.max(0, v - red)); }
  }
  checkKO(G, D);
  return blocked ? 'block' : 'hit';
}

function checkKO(G, D) {
  if (D.hp > 0 || D.ko) return;
  if (D.c === 2 && !D.revived) {
    D.revived = true; D.hp = D.maxHp * BAL[2].reviveHp; D.hitT = 0;
    G.freezeT = Math.max(G.freezeT, 75);
    note(G, `JJjin 부활! (체력 ${Math.round(BAL[2].reviveHp * 100)}%)`, '#f5c542', 110); ev(G, 'sfx', 'revive'); ev(G, 'revive', D.x, D.y);
    return;
  }
  D.hp = 0; D.ko = true;
}

function heal(G, F, amt) {
  F.hp = Math.min(F.maxHp, F.hp + amt);
  ev(G, 'heal', F.x, F.y + 50 * lookOf(F).H);
  ev(G, 'float', F.x, F.y + 70, '+' + Math.round(amt), '#7dff9a');
}

// ---------- 투사체 ----------
function spawnProj(G, F, t, vx, life, r, extra) {
  const p = Object.assign({ id: ++G.pid, t, x: F.x + F.f * (radius(F) + 6), y: F.y + 50 * lookOf(F).H, vx: F.f * vx, o: F.side, life, r, age: 0 }, extra || {});
  G.proj.push(p);
  return p;
}

const PROJ_HIT = {
  vacuum(G, A, T, p) {
    const res = applyDamage(G, A, T, 0, 'VACUUM');
    if (res === 'hit' || (res === 'block' && T.c !== 0)) { T.kb = sign(p.vx) * BAL[0].vacPush; T.hitT = Math.max(T.hitT, BAL[0].vacStun); ev(G, 'sfx', 'whoosh'); }
    if (res === 'block' && T.c === 0) ev(G, 'float', T.x, T.y + 70, '끈기!', '#7fd4ff');
  },
  tooth(G, A, T, p) {
    const res = applyDamage(G, A, T, BAL[1].toothDmg, 'TOOTH');
    if (res === 'hit') { T.kb = sign(p.vx) * 1.5; T.hitT = Math.max(T.hitT, 8); }
  },
  molacut(G, A, T, p) {
    const res = applyDamage(G, A, T, Math.max(0.5, T.hp * BAL[1].cutPct), 'MOLACUT', { fixed: true });
    if (res === 'hit') { T.hitT = Math.max(T.hitT, 12); ev(G, 'shake', 6, 3); }
  },
  bamboo(G, A, T, p) {
    const res = applyDamage(G, A, T, BAL[3].bambooDmg, 'BAMBOO');
    if (res === 'hit') { T.kb = sign(p.vx) * 4; T.hitT = Math.max(T.hitT, 14); }
  },
  nunchaku(G, A, T, p) {
    const res = applyDamage(G, A, T, BAL[5].nunDmg, 'GEOKGI');
    if (res === 'hit' || res === 'block') { T.rootT = Math.max(T.rootT, BAL[5].nunRoot); ev(G, 'float', T.x, T.y + 80, '고정!', '#48e0c0'); }
    if (res === 'hit') T.hitT = Math.max(T.hitT, 14);
  },
  gaegura(G, A, T, p) {
    const res = applyDamage(G, A, T, BAL[7].gaeDmg, 'GAEGURA');
    if (res === 'hit' || res === 'block') { T.rootT = Math.max(T.rootT, BAL[7].gaeRoot); T.kb = sign(p.vx) * 6; }
  },
  poison(G, A, T, p) {
    const res = applyDamage(G, A, T, 0, 'POISON_BULLET');
    if (res === 'hit' || res === 'block') { T.poisT = BAL[7].poisT; T.poisTick = 0; T.poisDmg = BAL[7].poisTick; ev(G, 'poison', T.x, T.y + 50); ev(G, 'float', T.x, T.y + 80, '독!', '#7dff4d'); }
  },
  note(G, A, T, p) {
    const res = applyDamage(G, A, T, p.dmg, 'NOTE');
    if (res === 'hit' || res === 'block') {
      if (A.noteSess === p.sess) {
        A.noteHits++;
        if (A.noteHits === 3) { heal(G, A, BAL[8].noteHeal); A.noteHits = -99; }
      }
    }
  },
  fart(G, A, T, p) {
    const res = applyDamage(G, A, T, (ATK.pBase + ATK.pStep) * A.mul * BAL[10].fartMul, 'TOXIC_FART');
    if (res === 'hit' || res === 'block') { T.poisT = BAL[10].poisT; T.poisTick = 0; T.poisDmg = BAL[10].poisTick; ev(G, 'poison', T.x, T.y + 50); }
    if (res === 'hit') T.hitT = Math.max(T.hitT, 10);
  },
};

function updateProjectiles(G) {
  const list = G.proj;
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    p.x += p.vx; p.life--; p.age++;
    const A = G.F[p.o], T = G.F[1 - p.o];
    if (!T.ko) {
      const LT = lookOf(T);
      const top = T.y + (T.guard ? 72 : 96) * LT.H;
      if (Math.abs(p.x - T.x) < p.r + radius(T) * 0.75 && p.y > T.y + 4 && p.y < top) {
        PROJ_HIT[p.t](G, A, T, p);
        ev(G, 'spark', p.x, p.y, p.t === 'poison' || p.t === 'fart' ? 'poison' : 'hit');
        list.splice(i, 1);
        continue;
      }
    }
    if (p.life <= 0 || p.x < -20 || p.x > ARENA_W + 20) list.splice(i, 1);
  }
  // 투사체끼리 상쇄
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      if (a.o !== b.o && Math.abs(a.x - b.x) < a.r + b.r && Math.abs(a.y - b.y) < a.r + b.r) {
        ev(G, 'spark', (a.x + b.x) / 2, (a.y + b.y) / 2, 'clash'); ev(G, 'sfx', 'clash');
        a.life = 0; b.life = 0; a.x = -999; b.x = -999;
      }
    }
  }
  G.proj = list.filter((p) => p.x > -100);
  // 죽순 함정
  for (let i = G.traps.length - 1; i >= 0; i--) {
    const tr = G.traps[i];
    tr.age = (tr.age || 0) + 1;
    const T = G.F[1 - tr.o];
    if (tr.age > 20 && !T.ko && T.y <= 0 && Math.abs(T.x - tr.x) < 10 + radius(T) * 0.4) {
      const res = applyDamage(G, G.F[tr.o], T, 5, 'SHOOT');
      if (res === 'hit') T.hitT = Math.max(T.hitT, 10);
      ev(G, 'spark', tr.x, 8, 'bamboo'); ev(G, 'sfx', 'stab');
      G.traps.splice(i, 1);
    }
  }
}

// ---------- 스킬 정의 ----------
function clampX(F) { F.x = clamp(F.x, 20, ARENA_W - 20); }

const SK = {
  0: [
    (G, F, O) => { spawnProj(G, F, 'vacuum', 7, 34, 13); return true; },
    (G, F, O) => { F.stimT = BAL[0].stimT; ev(G, 'sfx', 'powerup'); return true; },
  ],
  1: [
    (G, F, O) => { F.rushN = BAL[1].toothN; F.rushT = 8; return true; },
    (G, F, O) => { F.x -= F.f * 30; clampX(F); spawnProj(G, F, 'molacut', 11, 25, 10); return true; },
  ],
  2: [
    (G, F, O, inp) => {
      let dir = F.f;
      if (inp && inp.h & B_R) dir = 1; else if (inp && inp.h & B_L) dir = -1;
      F.dashT = BAL[2].dashT; F.dashDir = dir; return true;
    },
    (G, F, O) => {
      if (F.parryT > 0 || F.parryR > 0) return false;
      F.parryT = BAL[2].parryT; F.parryR = BAL[2].parryT + 16; return true;
    },
  ],
  3: [
    (G, F, O) => { spawnProj(G, F, 'bamboo', 10, 20, 10); return true; },
    (G, F, O) => {
      if (G.traps.filter((t) => t.o === F.side).length >= BAL[3].shootMax) return false;
      G.traps.push({ x: F.x, o: F.side, age: 0 }); return true;
    },
  ],
  4: [
    (G, F, O) => {
      const B4 = BAL[4];
      heal(G, F, F.maxHp * B4.ddHeal);
      F.ddN++;
      if (F.ddN % B4.ddEvery === 0) {
        F.maxHp = Math.round(F.maxHp * (1 + B4.ddMax));
        heal(G, F, F.maxHp * B4.ddMax);
        note(G, `더블다운 ${B4.ddEvery}회! 최대 체력 ${F.maxHp}`, '#ffb36b', 90);
      }
      return true;
    },
    (G, F, O) => {
      if (G.dice) return false;
      G.dice = { o: F.side, t: 45, val: 1, res: 0, pop: 0 };
      G.freezeT = Math.max(G.freezeT, 45 + 45);
      F.diceN++;
      if (F.diceN % BAL[4].angerEvery === 0) { F.mul += BAL[4].angerAdd; F.angerT = 90; note(G, `이은뚱 분노! 공격력 +${Math.round(BAL[4].angerAdd * 100)}%`, '#ff5a36', 90); }
      ev(G, 'sfx', 'dice');
      return true;
    },
    (G, F, O) => {   // E: 은맘 소환
      if (momAlive(F)) return false;
      F.momMax = F.momHp = Math.max(1, Math.round(F.hp * BAL[4].momPct * 10) / 10);
      F.momT = Math.round(BAL[4].momSec * SEC);
      note(G, `은맘 등장! (체력 ${F.momHp}) 모든 피해와 방해를 대신 받는다`, '#ff8fb3', 110);
      ev(G, 'sfx', 'revive'); ev(G, 'spark', F.x - F.f * 20, F.y + 50, 'immune');
      return true;
    },
    (G, F, O) => {   // R: 31.8의 저주
      F.curseT = Math.round(BAL[4].curseSec * SEC);
      note(G, '☠ 31.8의 저주 ☠ 피해 -31.8% · 공격 +31.8% · 반사 31.8%', '#c06bff', 130);
      ev(G, 'sfx', 'roar'); ev(G, 'shake', 12, 6); ev(G, 'aura', F.side, 'press');
      return true;
    },
  ],
  5: [
    (G, F, O) => { spawnProj(G, F, 'nunchaku', 9, 25, 10); return true; },
    (G, F, O) => {
      if (F.jeongP > 0 || F.jeongA > 0) return false;
      F.jeongP = BAL[5].prep; note(G, '正義 준비... (자기 구속)', '#48e0c0', 80); return true;
    },
  ],
  6: [
    (G, F, O) => { F.meokT = BAL[6].meokT; ev(G, 'sfx', 'chomp'); return true; },
    (G, F, O) => { F.manT = BAL[6].manT; ev(G, 'sfx', 'powerup'); return true; },
  ],
  7: [
    (G, F, O) => { spawnProj(G, F, 'gaegura', 9, 25, 11); return true; },
    (G, F, O) => { spawnProj(G, F, 'poison', 10, 25, 8); return true; },
  ],
  8: [
    (G, F, O) => { F.noteN = 3; F.noteT = 10; F.noteSess++; F.noteHits = 0; return true; },
    (G, F, O) => { if (F.board) return false; F.board = true; F.djUsed = false; ev(G, 'sfx', 'powerup'); return true; },
  ],
  9: [
    (G, F, O) => {
      if (!disrupt(G, O)) { O.rootT = Math.max(O.rootT, BAL[9].pressRoot); O.slowT = BAL[9].pressSlow; O.delayT = BAL[9].pressSlow; }
      ev(G, 'shake', 10, 5); ev(G, 'aura', F.side, 'press'); note(G, '압도!', '#c38bff', 60); return true;
    },
    (G, F, O) => { if (!disrupt(G, O)) O.guardOffT = BAL[9].forceT; ev(G, 'aura', F.side, 'force'); note(G, `포스! ${BAL[9].forceT / 60}초간 가드 불가`, '#c38bff', 80); return true; },
  ],
  10: [
    (G, F, O) => { spawnProj(G, F, 'fart', 6, 24, 14); ev(G, 'sfx', 'fart'); return true; },
    (G, F, O) => {
      ev(G, 'sfx', 'explosion'); ev(G, 'shake', 22, 10); ev(G, 'explosion', F.x, F.y + 40, F.f);
      G.flash = 12;
      note(G, '☢️ 매미킴 독 폭발! ☢️', '#7dff4d', 100);
      if (Math.abs(O.x - F.x) <= 80 + radius(O) * 0.5 && Math.abs(O.y - F.y) < 60) {
        const res = applyDamage(G, F, O, (ATK.pBase + ATK.pStep) * F.mul * BAL[10].explMul, 'TOXIC_EXPLOSION');
        if (res === 'hit') { O.poisT = BAL[10].poisT; O.poisTick = 0; O.poisDmg = BAL[10].poisTick; O.kb = sign(O.x - F.x) * 6; O.hitT = Math.max(O.hitT, 18); ev(G, 'poison', O.x, O.y + 50); }
      }
      return true;
    },
  ],
  11: [
    (G, F, O) => {
      const pool = [];
      for (const c of SELECT_ORDER) for (const s of [0, 1]) pool.push([c, s]);
      const [c, s] = pool[Math.floor(rnd() * pool.length)];
      const nm = skillDef(c, s).name;
      SK[c][s](G, F, O, null);
      note(G, `Tirón ai 딸깍! [${CHARS[c].name}]의 '${nm}' 카피 발동!`, '#ff9f43', 100);
      return true;
    },
    (G, F, O) => { if (!disrupt(G, O)) O.rootT = Math.max(O.rootT, BAL[11].majRoot); F.boostT = BAL[11].majBoost; ev(G, 'shake', 10, 5); ev(G, 'sfx', 'roar'); return true; },
  ],
  12: [
    (G, F, O) => {
      if (disrupt(G, O)) { note(G, '해킹 실패! 은맘이 막았다', '#ff8fb3', 80); return true; }
      const own = [0, 1, 2, 3].filter((s) => skillDef(O.c, s));
      let avail = own.filter((s) => O.seal[s] <= 0);
      if (!avail.length) avail = own;
      const s = avail[Math.floor(rnd() * avail.length)];
      O.seal[s] = BAL[12].sealSec * SEC;
      F.copy = { c: O.c, s };
      const nm = skillDef(O.c, s).name;
      ev(G, 'hack', F.side); ev(G, 'sfx', 'hack');
      note(G, `해킹 성공! ${CHARS[O.c].name}의 '${nm}' ${BAL[12].sealSec}초 봉인 + 복제 완료`, '#00e676', 120);
      return true;
    },
    (G, F, O) => { F.headT = 14; F.headHit = false; F.spikeT = BAL[12].spikeT; ev(G, 'sfx', 'charge'); return true; },
  ],
};

function useSkill(G, F, O, slot, inp) {
  // 힌참휴: 복제한 스킬이 있으면 Q로 1회 사용
  if (F.c === HINCHAM && slot === 0 && F.copy) {
    const cp = F.copy; F.copy = null;
    SK[cp.c][cp.s](G, F, O, inp);
    F.castT = 18;
    note(G, `복제 스킬 '${skillDef(cp.c, cp.s).name}' 발동!`, '#00e676', 80);
    ev(G, 'sfx', 'skill');
    return;
  }
  const def = skillDef(F.c, slot);
  if (!def) return;                               // 빈 슬롯 (E/R)
  if (F.seal[slot] > 0) { ev(G, 'sfx', 'deny'); return; }
  if (F.cd[slot] > 0) return;
  if (SK[F.c][slot](G, F, O, inp)) {
    let cd = SLOT_CD[slot];
    if (F.awake) cd = Math.max(1, cd - BAL[9].awakeCd);
    if (!(F.c === 8 && slot === 1)) F.cd[slot] = cd * SEC;   // 보드는 파괴될 때 쿨타임 시작
    F.castT = 18;
    ev(G, 'sfx', 'skill');
    ev(G, 'call', F.side, def.name);
  }
}

// ---------- 근접 공격 ----------
function startAttack(G, F, O, type) {
  let dur = type === 'P' ? 14 : 22, act = type === 'P' ? 3 : 6;
  let mult = 1;
  if (F.delayT > 0) mult *= 1.6;      // 창가오 압도: 딜레이 증가
  if (F.awake) mult /= BAL[9].awakeMul; // 창가오 각성: 공속 증가
  dur = Math.round(dur * mult); act = Math.max(2, Math.round(act * mult));
  let dmg;
  if (type === 'P') {
    F.combo = F.comboT > 0 ? (F.combo % 3) + 1 : 1;
    F.comboT = 40;
    dmg = ATK.pBase + F.combo * ATK.pStep;
  } else {
    const step = F.comboT > 0 && F.combo > 0 ? F.combo : 1;
    dmg = (ATK.pBase + step * ATK.pStep) * ATK.kickMul;
    F.combo = 0; F.comboT = 0;
  }
  dmg *= F.mul;
  if (F.c === 4 && (O.c === 1 || O.c === 2)) dmg *= 1 + BAL[4].friend;
  if (F.c === 5) dmg *= 1 + BAL[5].atkUp;
  F.atk = type; F.atkT = 0; F.atkDur = dur; F.atkAct = act; F.atkDmg = dmg; F.atkDone = false; F.atkStep = F.combo;
  ev(G, 'sfx', type === 'P' ? 'swing' : 'swing2');
}

function meleeHit(G, F, O) {
  const H = lookOf(F).H;
  const reach = (F.atk === 'P' ? ATK.pReach : ATK.kReach) * H;
  const dx = O.x - F.x;
  if (O.ko) return;
  if (Math.abs(dx) <= radius(F) + radius(O) + reach - 10 && sign(dx) === F.f && Math.abs(O.y - F.y) < 52) {
    const isK = F.atk === 'K';
    const res = applyDamage(G, F, O, F.atkDmg, isK ? 'KICK' : 'PUNCH');
    const hy = O.y + (isK ? 45 : 62) * lookOf(O).H;
    const hx = O.x - F.f * radius(O) * 0.6;
    if (F.c === 7 && isK && O.poisT > 0 && (res === 'hit' || res === 'block')) {
      O.poisT += BAL[7].footExt; ev(G, 'float', O.x, O.y + 90, '발냄새 +' + BAL[7].footExt / 60 + '초', '#a8ff60');
    }
    if (res === 'hit') {
      O.hitT = isK ? 15 : 11;
      O.kb = F.f * (isK ? 4.2 : 2.2) * (F.atkStep === 3 ? 1.6 : 1);
      if (O.y > 0) { O.vy = 3; O.vx = F.f * 1.5; }
      G.hitStop = isK ? 7 : 5;
      O.combo_recv = O.hitT > 0 && O.comboShowT > 0 ? O.combo_recv + 1 : 1;
      O.comboShowT = 60;
      ev(G, 'spark', hx, hy, isK ? 'big' : 'hit'); ev(G, 'sfx', isK ? 'hitK' : 'hitP');
      ev(G, 'shake', isK ? 6 : 3, isK ? 4 : 2);
      O.hitFlash = 4;
    } else if (res === 'mom') {
      G.hitStop = 3; ev(G, 'sfx', 'block');
    } else if (res === 'block') {
      O.blockT = 8;
      if (O.c !== 0) O.kb = F.f * (isK ? 3.4 : 1.4);
      G.hitStop = 4;
      ev(G, 'spark', hx, hy, 'guard'); ev(G, 'sfx', 'block');
    }
  } else {
    ev(G, 'sfx', 'miss');
  }
}

// ---------- 캐릭터 한 명 프레임 처리 ----------
const dec = (F, k) => { if (F[k] > 0) F[k]--; };
function stepFighter(G, F, O, inp) {
  const L = lookOf(F), H = L.H;
  F.anim++;
  for (const k of ['stimT', 'meokT', 'manT', 'parryT', 'parryR', 'slowT', 'delayT', 'guardOffT', 'boostT', 'spikeT', 'hitT', 'blockT', 'castT', 'angerT', 'hitFlash', 'recov', 'comboShowT', 'rootT']) dec(F, k);
  for (let s = 0; s < 4; s++) { if (F.cd[s] > 0) F.cd[s]--; if (F.seal[s] > 0) F.seal[s]--; }
  if (F.comboT > 0) { F.comboT--; if (F.comboT === 0) F.combo = 0; }
  if (F.jeongP > 0) { F.jeongP--; if (F.jeongP === 0) { F.jeongA = BAL[5].act; note(G, `正義 발동! ${(BAL[5].act / 60).toFixed(1)}초간 공격 무효`, '#48e0c0', 80); ev(G, 'sfx', 'powerup'); } }
  dec(F, 'jeongA'); dec(F, 'curseT');
  if (F.momT > 0) { F.momT--; if (F.momT === 0 && F.momHp > 0) { F.momHp = 0; note(G, '은맘이 돌아갔다', '#ff8fb3', 60); } }
  // 독
  if (F.poisT > 0) {
    F.poisT--; F.poisTick++;
    if (F.poisTick >= 60) {
      F.poisTick = 0;
      if (momAlive(F)) { momTake(G, F, F.poisDmg); } else F.hp -= F.poisDmg; ev(G, 'poison', F.x, F.y + 50 * H); ev(G, 'float', F.x, F.y + 80 * H, String(F.poisDmg), '#7dff4d');
      checkKO(G, F);
    }
  }
  // mola008X 패시브: 8초마다 체력 10 회복
  if (F.c === 1) { F.regenT++; if (F.regenT >= BAL[1].regenSec * SEC) { F.regenT = 0; if (F.hp < F.maxHp) heal(G, F, BAL[1].regen); } }
  // 매미킴 패시브: 시한폭탄
  if (F.c === 10) {
    const red = BAL[10].bombRed;
    if (!F.maemOwn && F.hp <= F.maxHp * 0.5) { F.maemOwn = true; F.cd[1] = Math.max(0, F.cd[1] - red * SEC); note(G, `매미킴 시한폭탄! 독 폭발 쿨 -${red}초`, '#ff7b3b', 80); }
    if (!F.maemEnemy && O.hp <= O.maxHp * 0.5) { F.maemEnemy = true; F.cd[1] = Math.max(0, F.cd[1] - red * SEC); note(G, `매미킴 시한폭탄! 독 폭발 쿨 -${red}초`, '#ff7b3b', 80); }
  }
  // 연발 스킬
  if (F.rushN > 0) { F.rushT++; if (F.rushT >= 8) { F.rushT = 0; F.rushN--; spawnProj(G, F, 'tooth', 8.5, 18, 6); ev(G, 'sfx', 'tooth'); } }
  if (F.noteN > 0) {
    F.noteT++;
    if (F.noteT >= 10) {
      F.noteT = 0; F.noteN--;
      const ratio = F.c !== O.c ? BAL[8].noteDiff : BAL[8].noteSame;
      spawnProj(G, F, 'note', 8.5, 25, 7, { dmg: (ATK.pBase + ATK.pStep) * F.mul * ratio, sess: F.noteSess, k: 3 - F.noteN });
      ev(G, 'sfx', 'note' + (3 - F.noteN));
    }
  }

  const grounded = F.y <= 0;
  if (grounded && !F.atk && F.dashT <= 0 && F.headT <= 0) F.f = O.x > F.x ? 1 : -1;

  const stunned = F.hitT > 0 || F.blockT > 0;
  const canMove = F.rootT <= 0 && F.jeongP <= 0;
  const h = inp ? inp.h : 0, p = inp ? inp.p : 0;

  // 가드
  F.guard = !stunned && grounded && !!(h & B_D) && F.guardOffT <= 0 && !F.atk && F.dashT <= 0 && F.headT <= 0;
  if (F.blockT > 0 && F.guardOffT <= 0) F.guard = true;

  let speed = 2.3;
  if (F.c === 3) speed *= BAL[3].spd;
  if (F.boostT > 0) speed *= 1 + BAL[11].majSpd;
  if (F.awake) speed *= BAL[9].awakeMul;
  if (F.board) speed *= BAL[8].boardSpd;
  if (F.slowT > 0) speed *= 0.5;
  const dir = (h & B_R ? 1 : 0) - (h & B_L ? 1 : 0);

  if (!stunned) {
    if (grounded) {
      if (!F.guard && !F.atk && canMove && F.dashT <= 0 && F.headT <= 0) F.vx = dir * speed * (dir === F.f ? 1 : 0.85);
      else F.vx = 0;
    }
    if (p & B_U) {
      if (grounded && canMove && !F.atk && !F.guard && F.dashT <= 0 && F.headT <= 0) {
        F.vy = 7.3; F.vx = dir * speed * 1.1; F.djUsed = false; ev(G, 'sfx', 'jump');
      } else if (!grounded && F.board && !F.djUsed) {
        F.vy = 6.6; F.djUsed = true; F.vx = dir * speed * 1.1; ev(G, 'sfx', 'jump'); ev(G, 'spark', F.x, F.y + 4, 'dust');
      }
    }
    const canAtk = !F.atk && F.recov <= 0 && !F.guard && F.dashT <= 0 && F.headT <= 0;
    if (canAtk && (p & B_P)) startAttack(G, F, O, 'P');
    else if (canAtk && (p & B_K)) startAttack(G, F, O, 'K');
    for (let s = 0; s < 4; s++) if (!F.guard && (p & B_SK[s])) useSkill(G, F, O, s, inp);
  } else if (grounded) F.vx = 0;

  // 공격 진행
  if (F.atk) {
    F.atkT++;
    if (F.atkT === F.atkAct && !F.atkDone) { F.atkDone = true; meleeHit(G, F, O); }
    if (F.atkT >= F.atkDur) { F.atk = null; F.recov = 2; }
    if (stunned && F.hitT > 0) F.atk = null;
  }
  // 대시 (JJjin)
  if (F.dashT > 0) { F.dashT--; F.x += F.dashDir * 12; if (F.anim % 2 === 0) ev(G, 'ghost', F.side); }
  // 박치기 (힌참휴)
  if (F.headT > 0) {
    F.headT--;
    if (F.headT > 6) F.x += F.f * 3.2;
    if (F.headT === 7 && !F.headHit) {
      F.headHit = true;
      const dx = O.x - F.x;
      if (Math.abs(dx) <= radius(F) + radius(O) + 18 && sign(dx) === F.f && Math.abs(O.y - F.y) < 50) {
        const res = applyDamage(G, F, O, BAL[12].headDmg, 'HEADBUTT', { fixed: true });
        if (res === 'hit') { O.hitT = 16; O.kb = F.f * 5; G.hitStop = 7; ev(G, 'spark', O.x - F.f * radius(O) * 0.5, O.y + 75 * lookOf(O).H, 'big'); ev(G, 'sfx', 'hitK'); ev(G, 'shake', 8, 5); }
      } else ev(G, 'sfx', 'miss');
    }
  }

  // 물리
  if (!grounded || F.vy > 0) {
    F.vy -= 0.36;
    F.y += F.vy;
    if (canMove || F.vy > 0) F.x += F.vx;
    if (F.y <= 0) { F.y = 0; F.vy = 0; F.vx = 0; F.djUsed = false; ev(G, 'land', F.side); }
  } else {
    F.x += F.vx;
  }
  if (F.kb) { F.x += F.kb; F.kb *= 0.8; if (Math.abs(F.kb) < 0.1) F.kb = 0; }
}

// ---------- 공통 정리 ----------
function resolveBodies(G) {
  const [a, b] = G.F;
  const minD = radius(a) + radius(b) - 4;
  const d = b.x - a.x;
  if (Math.abs(d) < minD && Math.abs(a.y - b.y) < 60) {
    const ov = (minD - Math.abs(d)) / 2;
    const s = d === 0 ? (a.side === 0 ? 1 : -1) : sign(d);
    a.x -= s * ov; b.x += s * ov;
  }
  for (const F of G.F) clampX(F);
  // 한 화면 안에 머물기
  const sep = Math.abs(b.x - a.x);
  if (sep > MAX_SEP) {
    const ex = (sep - MAX_SEP) / 2, s = sign(b.x - a.x);
    a.x += s * ex; b.x -= s * ex;
  }
  for (const F of G.F) clampX(F);
}

// ---------- 메인 스텝 ----------
function stepGame(G, inputs) {
  G.pt++;
  for (const n of G.notes) n.life--;
  G.notes = G.notes.filter((n) => n.life > 0);
  if (G.flash > 0) G.flash--;

  if (G.phase === 'intro') {
    if (G.pt === 1) ev(G, 'announce', 'round', G.round);
    if (G.pt === 75) ev(G, 'announce', 'fight');
    if (G.pt >= 110) { G.phase = 'fight'; G.pt = 0; }
    for (const F of G.F) { F.anim++; F.f = G.F[1 - F.side].x > F.x ? 1 : -1; }
    return;
  }
  if (G.phase === 'ko') {
    for (const F of G.F) {
      F.anim++;
      if (F.y > 0 || F.vy > 0) { F.vy -= 0.36; F.y += F.vy; F.x += F.vx; if (F.y <= 0) { F.y = 0; F.vy = 0; F.vx = 0; } }
      if (F.kb) { F.x += F.kb; F.kb *= 0.85; if (Math.abs(F.kb) < 0.1) F.kb = 0; }
    }
    resolveBodies(G);
    if (G.pt === 100 && G.rw >= 0) ev(G, 'announce', 'winround', G.rw);
    if (G.pt >= 200) {
      const [a, b] = G.F;
      if (a.wins >= WIN_ROUNDS || b.wins >= WIN_ROUNDS || G.round >= 5) {
        G.phase = 'end'; G.pt = 0;
        G.mw = a.wins === b.wins ? -1 : a.wins > b.wins ? 0 : 1;
        ev(G, 'announce', 'match', G.mw);
      } else {
        G.round++;
        resetRound(G);
      }
    }
    return;
  }
  if (G.phase === 'end') { for (const F of G.F) F.anim++; return; }

  // ---- fight ----
  if (G.freezeT > 0) {
    G.freezeT--;
    if (G.dice) {
      const d = G.dice;
      if (d.t > 0) {
        d.t--;
        d.val = 1 + Math.floor(rnd() * 6);
        if (d.t % 4 === 0) ev(G, 'sfx', 'tick');
        if (d.t === 0) {
          d.res = 1 + Math.floor(rnd() * 6); d.val = d.res; d.pop = 45;
          const C = G.F[d.o], T = G.F[1 - d.o];
          let dmg = d.res * BAL[4].dicePer * C.mul;
          if (C.c === 4 && (T.c === 1 || T.c === 2)) dmg *= 1 + BAL[4].friend;
          const res = applyDamage(G, C, T, dmg, 'DICE');
          if (res === 'hit') { T.hitT = 18; ev(G, 'spark', T.x, T.y + 60, 'big'); ev(G, 'shake', 10, 6); }
          ev(G, 'sfx', d.res >= 5 ? 'jackpot' : 'hitK');
          note(G, `🎲 하츠 스테리오: ${d.res}! (${Math.round(dmg)} 데미지)`, '#ffcc33', 90);
        }
      } else if (d.pop > 0) { d.pop--; if (d.pop === 0) G.dice = null; }
    }
    for (const F of G.F) F.anim++;
    endCheck(G);
    return;
  }
  if (G.hitStop > 0) { G.hitStop--; return; }

  G.roundF++;
  G.timer--;
  if (G.roundF === BAL[9].awakeSec * SEC) {
    for (const F of G.F) if (F.c === 9) { F.awake = true; }
    if (G.F.some((F) => F.c === 9)) { note(G, '🔥 가오가 온몸을 지배했습니다 🔥', '#d580ff', 150); ev(G, 'sfx', 'roar'); }
  }
  const [a, b] = G.F;
  stepFighter(G, a, b, inputs[0]);
  stepFighter(G, b, a, inputs[1]);
  resolveBodies(G);
  updateProjectiles(G);
  endCheck(G);
}

function endCheck(G) {
  if (G.phase !== 'fight') return;
  const [a, b] = G.F;
  let ended = false;
  if (a.ko || b.ko) {
    ended = true; G.koType = 'KO';
    if (a.ko && b.ko) G.rw = -1; else G.rw = a.ko ? 1 : 0;
  } else if (G.timer <= 0) {
    ended = true; G.koType = 'TIME';
    const ra = a.hp / a.maxHp, rb = b.hp / b.maxHp;
    G.rw = Math.abs(ra - rb) < 0.001 ? -1 : ra > rb ? 0 : 1;
  }
  if (!ended) return;
  G.phase = 'ko'; G.pt = 0; G.freezeT = 0; G.dice = null; G.hitStop = 0;
  G.proj = [];
  if (G.rw === -1) { a.wins++; b.wins++; }
  else {
    const W = G.F[G.rw];
    W.wins++;
    G.perfect = W.hp >= W.maxHp - 0.01;
  }
  for (const F of G.F) {
    F.atk = null; F.guard = false; F.dashT = 0; F.headT = 0;
    for (const k of ['hitFlash', 'stimT', 'meokT', 'manT', 'jeongA', 'jeongP', 'parryT', 'rootT', 'guardOffT', 'slowT', 'poisT', 'hitT', 'blockT', 'castT', 'spikeT', 'angerT', 'rushN', 'noteN', 'momHp', 'momT', 'curseT']) F[k] = 0;
    if (F.ko) { F.vy = 4; F.vx = -F.f * 2.2; F.y = Math.max(F.y, 0.1); }
  }
  ev(G, 'announce', G.koType === 'KO' ? 'ko' : 'time');
  ev(G, 'sfx', 'ko');
}

// ---- 11_ai.js ----
// ============================================================
//  CPU 인공지능
// ============================================================
const DIFF = {
  0: { name: '쉬움', block: 0.3, interval: 22, aggr: 0.45, skill: 0.25 },
  1: { name: '보통', block: 0.6, interval: 14, aggr: 0.6, skill: 0.4 },
  2: { name: '어려움', block: 0.85, interval: 8, aggr: 0.75, skill: 0.55 },
};

// 스킬별 AI 사용 조건 (dist = 거리, F = 자신, O = 상대)
const AI_SKILL = {
  0: [(F, O, d) => d > 70 && d < 240, (F, O, d) => d < 120],
  1: [(F, O, d) => d < 140, (F, O, d) => d > 70 && d < 230],
  2: [(F, O, d) => d > 95 && d < 260, () => false],
  3: [(F, O, d) => d > 50 && d < 190, (F, O, d) => d < 90],
  4: [(F, O, d) => F.hp < F.maxHp * 0.9, (F, O, d) => true, (F, O, d) => d < 220, (F, O, d) => d < 200],
  5: [(F, O, d) => d < 210, (F, O, d) => F.hp < F.maxHp * 0.55 && d > 90],
  6: [(F, O, d) => O.atk && d < 90, (F, O, d) => F.hp < F.maxHp * 0.75 && d < 100],
  7: [(F, O, d) => d < 180, (F, O, d) => O.poisT <= 0 && d < 230],
  8: [(F, O, d) => d > 60 && d < 210, (F, O, d) => !F.board],
  9: [(F, O, d) => d < 170, (F, O, d) => d < 140],
  10: [(F, O, d) => d < 140, (F, O, d) => d < 78],
  11: [(F, O, d) => d < 220, (F, O, d) => d < 140],
  12: [(F, O, d) => (F.copy ? d < 190 : true), (F, O, d) => d < 62],
};

function makeAIMem() { return { t: 10, plan: 'wait', planT: 0, guardT: 0, reacted: false, prevH: 0, atkCad: 0 }; }

function aiInput(G, F, O, mem, diffLv) {
  const D = DIFF[diffLv] || DIFF[1];
  let h = 0, p = 0;
  if (G.phase !== 'fight') { mem.prevH = 0; return { h: 0, p: 0 }; }
  const dx = O.x - F.x, dist = Math.abs(dx);
  const toward = dx > 0 ? B_R : B_L, away = dx > 0 ? B_L : B_R;

  // --- 위협 감지 ---
  const pRange = radius(F) + radius(O) + ATK.pReach * lookOf(F).H - 14;
  const kRange = radius(F) + radius(O) + ATK.kReach * lookOf(F).H - 14;
  const oRange = radius(F) + radius(O) + (O.atk === 'K' ? ATK.kReach : ATK.pReach) * lookOf(O).H;
  const meleeThreat = O.atk && O.atkT < O.atkAct + 1 && dist < oRange + 8;
  const projThreat = G.proj.find((q) => q.o === O.side && sign(F.x - q.x) === sign(q.vx) && Math.abs(F.x - q.x) < 85);
  if (mem.guardT > 0) {
    mem.guardT--; h |= B_D;
  } else if ((meleeThreat || projThreat) && !mem.reacted) {
    mem.reacted = true;
    if (rnd() < D.block) {
      if (F.c === 2 && F.parryR <= 0 && F.cd[1] <= 0 && F.seal[1] <= 0 && meleeThreat && rnd() < 0.7) p |= B_S2;          // JJjin 패링
      else if (F.c === 6 && F.cd[0] <= 0 && F.seal[0] <= 0 && rnd() < 0.5) p |= B_S1;   // 안거녕 먹부림
      else if (projThreat && F.c === 6) { /* 투사체 무적 */ }
      else if (projThreat && rnd() < 0.35 && F.rootT <= 0) { p |= B_U; h |= toward; }
      else { mem.guardT = meleeThreat ? 16 : 22; h |= B_D; }
    }
  }
  if (!meleeThreat && !projThreat) mem.reacted = false;
  if (h & B_D) { mem.prevH = h; return { h, p }; }

  // --- 계획 수립 ---
  mem.t--;
  if (mem.t <= 0) {
    mem.t = D.interval + Math.floor(rnd() * D.interval);
    const r = rnd();
    // 스킬 사용 시도
    const slots = [0, 1, 2, 3].filter((s) => {
      if (!skillDef(F.c, s) || !AI_SKILL[F.c][s]) return false;
      const ready = (F.cd[s] <= 0 && F.seal[s] <= 0) || (s === 0 && F.c === HINCHAM && F.copy);
      return ready && AI_SKILL[F.c][s](F, O, dist);
    });
    if (slots.length && r < D.skill) {
      p |= B_SK[slots[Math.floor(rnd() * slots.length)]];
      if (F.c === 2 && (p & B_S1)) h |= toward;
      mem.plan = 'wait'; mem.planT = 6;
    } else if (dist > 150) {
      mem.plan = rnd() < 0.85 ? 'approach' : 'jumpin'; mem.planT = 30;
    } else if (dist > kRange) {
      const q = rnd();
      mem.plan = q < D.aggr ? 'approach' : q < D.aggr + 0.15 ? 'jumpin' : q < 0.92 ? 'retreat' : 'wait';
      mem.planT = 24;
    } else {
      const q = rnd();
      mem.plan = q < D.aggr + 0.15 ? 'attack' : q < 0.9 ? 'retreat' : 'wait';
      mem.planT = 20;
    }
  }
  // --- 계획 실행 ---
  if (mem.planT > 0) mem.planT--;
  switch (mem.plan) {
    case 'approach':
      h |= toward;
      if (dist < kRange) mem.plan = 'attack';
      break;
    case 'retreat': h |= away; break;
    case 'jumpin':
      if (F.y <= 0) { p |= B_U; h |= toward; mem.plan = 'airatk'; }
      break;
    case 'airatk':
      h |= toward;
      if (F.y > 10 && dist < kRange) { p |= B_K; mem.plan = 'attack'; }
      if (F.y <= 0 && F.vy === 0 && mem.planT <= 0) mem.plan = 'wait';
      break;
    case 'attack':
      if (dist > kRange) h |= toward;
      else {
        mem.atkCad--;
        if (mem.atkCad <= 0 && !F.atk) {
          p |= dist > pRange ? B_K : rnd() < 0.7 ? B_P : B_K;
          mem.atkCad = 4 + Math.floor(rnd() * (diffLv === 2 ? 4 : 12));
        }
      }
      if (mem.planT <= 0) mem.plan = 'wait';
      break;
    default: break;
  }
  mem.prevH = h;
  return { h, p };
}

// ---- 20_fighter_gfx.js ----
// ============================================================
//  캐릭터 그래픽 (스켈레톤 + 도트풍 외곽선)
//  각도 규칙: 0 = 아래, +는 바라보는 방향(앞)으로 회전
// ============================================================
const OUT = '#140c18';
const _shc = {};
function sh(col, a) { const k = col + '|' + a; return _shc[k] || (_shc[k] = shade(col, a)); }

function seg(ctx, x1, y1, x2, y2, w, col, hl) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = w + 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if (hl !== false && w >= 3) {
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    let nx = -dy / len, ny = dx / len;
    if (ny > 0 || (ny === 0 && nx > 0)) { nx = -nx; ny = -ny; }
    const o = w * 0.24;
    ctx.strokeStyle = sh(col, 0.3); ctx.lineWidth = Math.max(1, w * 0.28);
    ctx.beginPath(); ctx.moveTo(x1 + nx * o, y1 + ny * o); ctx.lineTo(x2 + nx * o, y2 + ny * o); ctx.stroke();
  }
}
function circ(ctx, x, y, r, col, outline) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (outline !== false) { ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(x, y, r + 1, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  ctx.fillStyle = col; ctx.fill();
}
function ell(ctx, x, y, rx, ry, col, outline, rot) {
  if (outline !== false) {
    ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(x, y, rx + 1, ry + 1, rot || 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function poly(ctx, pts, col, outline) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (outline !== false) { ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke(); }
  ctx.fillStyle = col; ctx.fill();
}

// ---------------- 포즈 ----------------
function P(o) {
  return Object.assign({ lean: 0.06, tilt: 0, fa: [0.8, 1.95], ba: [0.5, 2.1], fl: [0.26, 0.34], bl: [-0.22, 0.14], hand: 'fist', bhand: 'fist', eyes: 'n', mouth: 'n', air: false, rot: 0, dy: 0 }, o);
}
function idlePose(c, t) {
  const br = Math.sin(t * 0.09);
  let p;
  switch (c) {
    case 9: // 창가오: 팔짱 + 턱 들기
      p = P({ lean: -0.04, tilt: -0.12, fa: [0.35, 2.55], ba: [0.55, 2.45], fl: [0.14, 0.06], bl: [-0.16, 0.04], hand: 'hide', bhand: 'hide' });
      break;
    case 5: // 使命감: 주짓수 자세 (낮은 자세, 손 펴기)
      p = P({ lean: 0.22, fa: [1.05, 1.05], ba: [0.85, 1.25], fl: [0.55, 0.75], bl: [-0.45, 0.35], hand: 'open', bhand: 'open' });
      break;
    case 4: case 6: // 통통한 캐릭터: 넓은 자세
      p = P({ lean: 0.0, fa: [0.7, 1.7], ba: [0.45, 1.8], fl: [0.32, 0.25], bl: [-0.35, 0.15] });
      break;
    case 8: // 힙찔 강: 리듬 타기
      p = P({ lean: 0.04 + Math.sin(t * 0.2) * 0.04, fa: [0.6, 1.7 + Math.sin(t * 0.2) * 0.3], ba: [0.3, 1.6], fl: [0.25, 0.3 + Math.max(0, Math.sin(t * 0.2)) * 0.3], bl: [-0.28, 0.2] });
      break;
    case 12: // 힌참휴: 해커 자세
      p = P({ lean: 0.1, fa: [1.0, 1.5], ba: [0.8, 1.6], fl: [0.25, 0.25], bl: [-0.25, 0.15], tilt: 0.05 });
      break;
    case 7: // 독민재B: 구부정
      p = P({ lean: 0.14, tilt: 0.1, fa: [0.75, 1.8], ba: [0.45, 1.9] });
      break;
    default:
      p = P({});
  }
  p.fa = [p.fa[0] + br * 0.04, p.fa[1]];
  p.ba = [p.ba[0] + br * 0.04, p.ba[1]];
  p.fl = [p.fl[0] + br * 0.03, p.fl[1] + br * 0.06];
  p.bl = [p.bl[0], p.bl[1] + br * 0.04];
  return p;
}

// 렌더용 상태 판정
function visualState(F, G) {
  if (F.ko) return 'ko';
  if (G) {
    if ((G.phase === 'ko' && G.rw === F.side && G.pt > 70) || (G.phase === 'end' && G.mw === F.side)) return 'win';
    if ((G.phase === 'ko' && G.pt > 70 && G.rw !== F.side && G.rw !== -1) || (G.phase === 'end' && G.mw !== F.side && G.mw !== -1)) return 'lose';
  }
  if (F.hitT > 0) return 'hit';
  if (F.blockT > 0 || F.guard) return 'guard';
  if (F.headT > 0) return 'head';
  if (F.dashT > 0) return 'dash';
  if (F.atk) return 'atk';
  if (F.y > 0.5) return 'jump';
  if (F.castT > 0) return 'cast';
  if (F.meokT > 0) return 'eat';
  if (F.jeongP > 0) return 'medit';
  if (F.parryT > 0) return 'parry';
  if (F.rootT > 0) return 'dizzy';
  if (Math.abs(F.vx) > 0.1) return 'walk';
  return 'idle';
}

function poseOf(F, vs, G) {
  const t = F.anim;
  let p = idlePose(F.c, t);
  switch (vs) {
    case 'walk': {
      const ph = t * 0.2 * (F.vx * F.f >= 0 ? 1 : -1);
      const s = Math.sin(ph), c = Math.cos(ph);
      p.fl = [0.12 + s * 0.45, 0.2 + Math.max(0, c) * 0.55];
      p.bl = [0.12 - s * 0.45, 0.2 + Math.max(0, -c) * 0.55];
      p.dy = Math.abs(s) * -1;
      if (F.c !== 9) { p.fa = [0.8 + s * 0.12, 1.9]; p.ba = [0.5 - s * 0.12, 2.0]; }
      break;
    }
    case 'jump':
      p.air = true;
      if (F.atk === 'K') { p.fl = [1.35, 0.1]; p.flx = 1.3; p.bl = [0.6, 1.7]; p.lean = -0.2; p.fa = [1.0, 1.4]; p.ba = [-0.3, 0.8]; }
      else if (F.atk === 'P') { p.fa = [1.75, 0.15]; p.fax = 1.2; p.lean = 0.2; p.fl = [1.0, 1.8]; p.bl = [0.5, 1.5]; }
      else if (F.vy > 1.5) { p.fl = [1.05, 1.9]; p.bl = [0.6, 1.7]; p.fa = [1.4, 1.5]; p.ba = [1.0, 1.6]; }
      else { p.fl = [0.5, 0.6]; p.bl = [0.1, 0.4]; p.fa = [1.2, 1.2]; p.ba = [0.9, 1.3]; }
      break;
    case 'guard':
      p = P({ lean: 0.02, fa: [1.25, 2.45], ba: [1.05, 2.55], fl: [1.0, 1.65], bl: [0.15, 1.35], eyes: 'n' });
      break;
    case 'atk': {
      const prog = F.atkT / Math.max(1, F.atkAct);
      const k = F.atkT <= F.atkAct ? Math.min(1, prog) : Math.max(0, 1 - (F.atkT - F.atkAct) / Math.max(1, F.atkDur - F.atkAct) * 1.2);
      if (F.atk === 'P') {
        p.mouth = 'shout';
        if (F.atkStep === 2) { p.ba = [lerp(0.5, 1.57, k), lerp(2.1, 0.05, k)]; p.fa = [0.55, 2.25]; p.lean = 0.06 + 0.25 * k; p.bhand = 'fist'; p.bax = 1 + 0.28 * k; }
        else if (F.atkStep === 3) { p.fa = [lerp(0.4, 2.75, k), lerp(2.2, 0.25, k)]; p.lean = -0.18 * k; p.fl = [lerp(0.3, 0.12, k), lerp(0.32, 0.05, k)]; p.bl = [lerp(-0.3, -0.15, k), lerp(0.18, 0.05, k)]; }
        else { p.fa = [lerp(0.8, 1.57, k), lerp(1.95, 0.05, k)]; p.lean = 0.06 + 0.16 * k; p.fax = 1 + 0.25 * k; }
        if (F.atkStep === 3) p.fax = 1 + 0.15 * k;
        if (F.c === 9) { p.ba = [0.5, 2.0]; p.bhand = 'fist'; p.hand = 'fist'; }
      } else {
        p.fl = [lerp(0.3, 1.65, k), lerp(0.32, 0.0, k)]; p.bl = [lerp(-0.3, -0.12, k), 0.05]; p.flx = 1 + 0.38 * k;
        p.lean = -0.38 * k; p.fa = [0.7, 1.6]; p.ba = [-0.35, 0.9]; p.mouth = 'shout';
        p.hand = 'fist'; p.bhand = 'fist';
      }
      break;
    }
    case 'hit':
      p = P({ lean: -0.38, tilt: -0.3, fa: [-0.5, 0.7], ba: [-0.7, 0.4], fl: [0.35, 0.45], bl: [-0.2, 0.3], eyes: 'hurt', mouth: 'open', hand: 'open', bhand: 'open', air: F.y > 0.5 });
      break;
    case 'ko': {
      const prog = G && G.phase !== 'fight' ? Math.min(1, (G.pt || 0) / 25) : 1;
      p = P({ lean: -0.2, tilt: -0.4, fa: [-1.4, 0.3], ba: [-1.8, 0.2], fl: [0.4, 0.3], bl: [0.1, 0.1], eyes: 'ko', mouth: 'open', hand: 'open', bhand: 'open', air: true });
      p.rot = -1.5 * prog; p.dy = 0;
      break;
    }
    case 'win':
      p = winPose(F.c, t);
      break;
    case 'lose':
      p = P({ lean: 0.45, tilt: 0.45, fa: [0.2, 0.3], ba: [0.1, 0.2], fl: [0.6, 1.2], bl: [0.2, 1.4], eyes: 'closed', mouth: 'n', hand: 'open', bhand: 'open' });
      break;
    case 'cast':
      p.fa = [1.5, 0.15]; p.ba = [1.45, 0.3]; p.lean = 0.16; p.hand = 'open'; p.bhand = 'open'; p.mouth = 'shout';
      p.fl = [0.45, 0.35]; p.bl = [-0.45, 0.1];
      break;
    case 'eat':
      p.fa = [0.9, 2.45 + Math.sin(t * 0.6) * 0.12]; p.hand = 'food'; p.mouth = t % 12 < 6 ? 'open' : 'n';
      break;
    case 'medit':
      p = P({ lean: 0, fa: [0.85, 2.15], ba: [0.85, 2.2], fl: [0.2, 0.1], bl: [-0.2, 0.1], eyes: 'closed', hand: 'open', bhand: 'open' });
      break;
    case 'parry':
      p.fa = [1.6, 0.9]; p.hand = 'open'; p.lean = -0.06; p.ba = [0.6, 2.0];
      break;
    case 'dizzy':
      p.fa = [0.3, 0.6]; p.ba = [0.2, 0.5]; p.lean = Math.sin(t * 0.15) * 0.12; p.eyes = 'dizzy'; p.hand = 'open'; p.bhand = 'open';
      break;
    case 'dash':
      p = P({ lean: 0.55, fa: [-0.7, 0.4], ba: [-0.9, 0.3], fl: [0.9, 0.7], bl: [-0.7, 0.3], mouth: 'shout' });
      break;
    case 'head':
      p = P({ lean: 0.95, tilt: 0.25, fa: [-0.6, 0.5], ba: [-0.8, 0.4], fl: [0.7, 0.7], bl: [-0.6, 0.2], mouth: 'shout' });
      break;
    default: break;
  }
  if (F.board && vs !== 'ko') p.board = true;
  if (lookOf(F).acc.chinUp && vs !== 'hit' && vs !== 'ko' && vs !== 'lose') p.tilt -= 0.1;
  return p;
}

function winPose(c, t) {
  const b = Math.sin(t * 0.12);
  switch (c) {
    case 9: return P({ lean: -0.08, tilt: -0.22, fa: [0.35, 2.55], ba: [0.55, 2.45], fl: [0.12, 0.05], bl: [-0.14, 0.04], hand: 'hide', bhand: 'hide', mouth: 'smirk' });
    case 5: return P({ lean: 0, fa: [1.57, 2.7 + b * 0.1], ba: [1.4, 2.7 + b * 0.1], fl: [0.25, 0.1], bl: [-0.25, 0.1], mouth: 'shout' });
    case 4: case 6: return P({ lean: -0.05, fa: [2.6 + b * 0.2, 0.4], ba: [2.4 - b * 0.2, 0.5], fl: [0.3, 0.2], bl: [-0.3, 0.1], mouth: 'smile', hand: 'open', bhand: 'open', dy: -Math.abs(b) * 3 });
    case 12: return P({ lean: 0.05, fa: [1.3, 1.6], ba: [1.1, 1.7], fl: [0.2, 0.1], bl: [-0.2, 0.1], mouth: 'smirk', hand: 'open', bhand: 'open' });
    case 8: return P({ lean: 0.1, fa: [2.2, 1.0 + b * 0.4], ba: [0.4, 1.5], fl: [0.3, 0.4], bl: [-0.3, 0.2], mouth: 'smile', hand: 'open', dy: -Math.abs(b) * 3 });
    default: return P({ lean: -0.05, fa: [2.9, 0.15], ba: [0.3, 1.9], fl: [0.2, 0.1], bl: [-0.25, 0.1], mouth: 'shout', dy: -Math.abs(b) * 2 });
  }
}

// ---------------- 캐릭터 그리기 ----------------
// (0,0) = 발 중앙, 오른쪽을 바라보는 기준으로 그림
function drawCharacter(ctx, c, pose, t, opts) {
  opts = opts || {};
  const L = CHARS[c].look, H = L.H, b = L.b, A = L.acc;
  const thL = 21 * H, shL = 21 * H, toL = 27 * H, uaL = 16 * H, faL = 15 * H, hr = b.headR * H;
  const skin = L.skin;
  const longSleeve = ['hoodie', 'track', 'jacket', 'coat', 'robe', 'hackerHood', 'dragon'].includes(L.topStyle);
  const giSleeve = L.topStyle === 'gi';
  const shorts = L.topStyle === 'tank';

  const leg = (a, ex) => {
    ex = ex || 1;
    const kx = Math.sin(a[0]) * thL * ex, ky = Math.cos(a[0]) * thL * ex, s = a[0] - a[1];
    return { kx, ky, fx: kx + Math.sin(s) * shL * ex, fy: ky + Math.cos(s) * shL * ex, s };
  };
  const FL = leg(pose.fl, pose.flx), BL = leg(pose.bl);
  let hipY = pose.air || pose.rot ? -(thL + shL) * 0.92 : -(Math.max(FL.fy, BL.fy) + 3 * H);
  if (pose.board) hipY -= 5;
  hipY += pose.dy || 0;
  const hipX = 0;
  const lean = pose.lean;
  const cl = Math.cos(lean), sl = Math.sin(lean);
  const tw = (lx, ly) => [hipX + lx * cl - ly * sl, hipY + lx * sl + ly * cl]; // 몸통 로컬 → 캐릭터 좌표
  const shC = tw(0, -toL);
  const fSh = tw(2.5 * H + b.muscle * 1.5, -toL + 2), bSh = tw(-2.5 * H - b.muscle * 1.5, -toL + 2);
  const headA = lean + pose.tilt;
  const hc = [shC[0] + Math.sin(headA) * (3 * H + hr), shC[1] - Math.cos(headA) * (3 * H + hr)];
  const fHip = tw(2 * H, 0), bHip = tw(-2 * H, 0);

  ctx.save();
  if (pose.rot) { ctx.translate(0, -6); ctx.rotate(pose.rot); }

  const arm = (s, a, xt) => {
    xt = xt || 1;
    const ex = s[0] + Math.sin(a[0]) * uaL * xt, ey = s[1] + Math.cos(a[0]) * uaL * xt;
    const a2 = a[0] + a[1];
    return { ex, ey, hx: ex + Math.sin(a2) * faL * xt, hy: ey + Math.cos(a2) * faL * xt, a2 };
  };
  const FA = arm(fSh, pose.fa, pose.fax), BA = arm(bSh, pose.ba, pose.bax);
  const TK = 1.32; // 도트 격투게임 느낌의 두툼한 팔다리
  const armW = b.arm * H * TK, foreW = b.fore * H * TK, thW = b.thigh * H * TK, shW = b.shin * H * TK;

  const drawArm = (S, AR, isFront, handType) => {
    if (handType === 'hide') return; // 팔짱(앞으로 가림)
    const sleeveCol = giSleeve ? L.top : L.top;
    // 위팔
    if (longSleeve || giSleeve) seg(ctx, S[0], S[1], AR.ex, AR.ey, armW + 1, isFront ? sleeveCol : sh(sleeveCol, -0.18));
    else if (L.topStyle === 'tank') seg(ctx, S[0], S[1], AR.ex, AR.ey, armW, isFront ? skin : sh(skin, -0.15));
    else {
      seg(ctx, S[0], S[1], AR.ex, AR.ey, armW, isFront ? skin : sh(skin, -0.15));
      const mx = lerp(S[0], AR.ex, 0.55), my = lerp(S[1], AR.ey, 0.55);
      seg(ctx, S[0], S[1], mx, my, armW + 1.5, isFront ? L.top : sh(L.top, -0.18));
    }
    // 아래팔
    if (longSleeve) seg(ctx, AR.ex, AR.ey, AR.hx, AR.hy, foreW + 0.5, isFront ? L.top : sh(L.top, -0.18));
    else seg(ctx, AR.ex, AR.ey, AR.hx, AR.hy, foreW, isFront ? skin : sh(skin, -0.15));
    if (giSleeve) {
      const mx = lerp(AR.ex, AR.hx, 0.45), my = lerp(AR.ey, AR.hy, 0.45);
      seg(ctx, AR.ex, AR.ey, mx, my, foreW + 1.6, isFront ? L.top : sh(L.top, -0.18));
    }
    if (L.topStyle === 'track') {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(S[0], S[1] - 1); ctx.lineTo(AR.ex, AR.ey - 1); ctx.lineTo(AR.hx, AR.hy - 1); ctx.stroke();
    }
    // 손
    const hc2 = isFront ? skin : sh(skin, -0.15);
    if (handType === 'open') ell(ctx, AR.hx, AR.hy, foreW * 0.75, foreW * 0.55, hc2, true, AR.a2);
    else if (handType === 'food') {
      circ(ctx, AR.hx, AR.hy, foreW * 0.75, hc2);
      // 닭다리
      ctx.save(); ctx.translate(AR.hx, AR.hy); ctx.rotate(-0.6);
      ell(ctx, 4, -2, 4, 3, '#b5651d'); seg(ctx, 0, 0, -3, 3, 1.5, '#f5f0e0', false);
      ctx.restore();
    } else circ(ctx, AR.hx, AR.hy, foreW * 0.78, hc2);
  };

  const pantsCol = L.pants;
  const drawLeg = (hip, LG, isFront) => {
    const pc = isFront ? pantsCol : sh(pantsCol, -0.2);
    const kx = hip[0] + LG.kx, ky = hip[1] + LG.ky, fx = hip[0] + LG.fx, fy = hip[1] + LG.fy;
    seg(ctx, hip[0], hip[1], kx, ky, thW, pc);
    if (shorts) seg(ctx, kx, ky, fx, fy, shW, isFront ? skin : sh(skin, -0.15));
    else seg(ctx, kx, ky, fx, fy, shW + (L.topStyle === 'gi' ? 1 : 0), pc);
    if (shorts) { ctx.strokeStyle = OUT; ctx.lineWidth = 1; }
    // 발 / 신발
    const dx = Math.cos(LG.s), dy = -Math.sin(LG.s);
    const shoeCol = L.shoes ? (isFront ? L.shoes : sh(L.shoes, -0.2)) : (isFront ? skin : sh(skin, -0.15));
    seg(ctx, fx - dx * 1.5, fy - dy * 1.5 + 1, fx + dx * 7 * H, fy + dy * 7 * H + 1, 4.2 * H, shoeCol, false);
    if (L.shoes) {
      ctx.strokeStyle = sh(shoeCol, -0.35); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(fx - dx * 1.5, fy - dy * 1.5 + 2.6 * H); ctx.lineTo(fx + dx * 7 * H, fy + dy * 7 * H + 2.6 * H); ctx.stroke();
    }
  };

  // ---- 뒤쪽 장식 ----
  if (A.tail) {
    const sw = Math.sin(t * 0.1) * 4;
    const p0 = tw(-6 * H, -2);
    ctx.strokeStyle = OUT; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.quadraticCurveTo(p0[0] - 16, p0[1] + 6 + sw, p0[0] - 24, p0[1] - 4 + sw); ctx.stroke();
    ctx.strokeStyle = L.top; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.quadraticCurveTo(p0[0] - 16, p0[1] + 6 + sw, p0[0] - 24, p0[1] - 4 + sw); ctx.stroke();
    poly(ctx, [[p0[0] - 24, p0[1] - 9 + sw], [p0[0] - 30, p0[1] - 2 + sw], [p0[0] - 22, p0[1] + sw]], '#ffcc33');
  }
  if (A.bamboo) {
    const a = tw(-8, -toL - 6), z = tw(8, 4);
    seg(ctx, a[0], a[1], z[0], z[1], 3, '#7dcea0');
    ctx.fillStyle = '#145a32';
    for (let i = 1; i < 4; i++) { const q = [lerp(a[0], z[0], i / 4), lerp(a[1], z[1], i / 4)]; ctx.fillRect(q[0] - 1.5, q[1] - 0.5, 3, 1); }
  }
  if (L.topStyle === 'coat') {
    const fl = Math.sin(t * 0.13) * 3;
    const w0 = tw(-b.waistW * 0.5 * H - 1, -2), w1 = tw(b.waistW * 0.3 * H, -2);
    poly(ctx, [w0, w1, [w1[0] - 2 + fl * 0.3, w1[1] + 26 * H], [w0[0] - 9 + fl, w0[1] + 27 * H]], sh(L.top, -0.25));
  }
  // 뒷다리, 뒷팔
  drawLeg(bHip, BL, false);
  drawArm(bSh, BA, false, pose.bhand);

  // ---- 몸통 ----
  const cw = (b.torsoW + b.muscle * 3) * H * 1.18, ww = b.waistW * H * 1.18, belly = b.belly, hips = b.hips * H;
  const torso = [];
  const bez = (p0, c, p1, n) => { for (let i = 0; i <= n; i++) { const u = i / n; torso.push(tw((1 - u) * (1 - u) * p0[0] + 2 * (1 - u) * u * c[0] + u * u * p1[0], (1 - u) * (1 - u) * p0[1] + 2 * (1 - u) * u * c[1] + u * u * p1[1])); } };
  bez([-ww / 2 - hips * 0.6 + belly * 3, 2], [-ww / 2 - hips - belly * 1, -toL * 0.25], [-cw / 2, -toL + 3], 6);
  torso.push(tw(-cw / 2 + 2, -toL - 1), tw(cw / 2 - 2, -toL - 1));
  bez([cw / 2, -toL + 3], [ww / 2 + belly * 24 * H + b.muscle * 3, -toL * 0.3], [ww / 2 + hips * 0.2 + belly * 4, 2], 10);
  poly(ctx, torso, L.top);
  // 몸통 음영 (뒤쪽)
  ctx.save(); ctx.clip();
  ctx.fillStyle = sh(L.top, -0.2);
  const back = [tw(-cw, -toL - 4), tw(-cw * 0.15, -toL - 4), tw(-ww * 0.25, 4), tw(-ww - 8, 4)];
  ctx.beginPath(); ctx.moveTo(back[0][0], back[0][1]); for (const q of back) ctx.lineTo(q[0], q[1]); ctx.fill();
  // 스타일별 디테일
  drawTorsoDetail(ctx, L, tw, cw, ww, toL, H, t);
  if (belly > 0) {
    const bc = tw(ww * 0.45 + belly * 6, -toL * 0.3);
    ctx.fillStyle = sh(L.top, 0.18); ctx.beginPath(); ctx.ellipse(bc[0], bc[1], 4 + belly * 3, 6 + belly * 3, lean, 0, Math.PI * 2); ctx.fill();
  }
  if (b.muscle > 0.6 && L.topStyle !== 'gi') {
    ctx.strokeStyle = sh(L.top, -0.3); ctx.lineWidth = 1;
    const pc = tw(cw * 0.1, -toL * 0.62), pe = tw(cw * 0.48, -toL * 0.55);
    ctx.beginPath(); ctx.moveTo(...pc); ctx.lineTo(...pe); ctx.stroke();
  }
  ctx.restore();

  // 로브 치마 (죽림고수)
  if (L.topStyle === 'robe') {
    const fl = Math.sin(t * 0.1) * 1.5;
    const a0 = tw(-ww / 2 - 1, -1), a1 = tw(ww / 2 + 1, -1);
    poly(ctx, [a0, a1, [a1[0] + 3 + fl, a1[1] + 15 * H], [a0[0] - 4 + fl, a0[1] + 15 * H]], sh(L.top, -0.08));
    if (A.sash) { const s0 = tw(-ww / 2, -3), s1 = tw(ww / 2, -3); seg(ctx, s0[0], s0[1], s1[0], s1[1], 3, A.sash, false); seg(ctx, s0[0], s0[1], s0[0] - 5 + fl, s0[1] + 9, 2, A.sash, false); }
  }
  // 앞다리
  drawLeg(fHip, FL, true);
  if (L.topStyle === 'gi' && A.belt) {
    const s0 = tw(-ww / 2 - 1, -3), s1 = tw(ww / 2 + 1, -3);
    seg(ctx, s0[0], s0[1], s1[0], s1[1], 3, A.belt, false);
    const k = tw(ww / 2 - 1, -3), fl = Math.sin(t * 0.12) * 1.5;
    seg(ctx, k[0], k[1], k[0] + 2 + fl, k[1] + 7, 1.6, A.belt, false);
    seg(ctx, k[0], k[1], k[0] - 1 + fl, k[1] + 8, 1.6, A.belt, false);
  }
  // 목
  const nb = tw(0, -toL + 1);
  seg(ctx, nb[0], nb[1], hc[0] - Math.sin(headA) * hr * 0.6, hc[1] + Math.cos(headA) * hr * 0.6, (4.5 + b.muscle * 2.5) * H, skin, false);
  if (A.phones) {
    const pn = tw(0, -toL + 1);
    ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(pn[0], pn[1] - 1, 4.5, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(pn[0], pn[1] - 1, 4.5, 0.2, Math.PI - 0.2); ctx.stroke();
    circ(ctx, pn[0] + 4.2, pn[1] + 1, 2, '#ff007f'); circ(ctx, pn[0] - 4.2, pn[1] + 1, 2, sh('#ff007f', -0.3));
  }
  if (A.gold || A.chain) {
    const pn = tw(1, -toL + 3);
    ctx.strokeStyle = '#f7d046'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(pn[0], pn[1], 4, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.fillStyle = '#ffe680'; ctx.fillRect(pn[0] - 0.5, pn[1] + 3.5, 1.5, 2);
  }
  if (A.napkin) {
    const n0 = tw(cw / 2 - 1, -toL + 4), n1 = tw(-1, -toL + 3), n2 = tw(cw / 2 + 2, -toL * 0.55);
    poly(ctx, [n0, n1, n2], '#ffffff');
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(n2[0] - 2, n2[1] - 3, 2, 2);
  }

  // ---- 머리 ----
  ctx.save();
  ctx.translate(hc[0], hc[1]);
  ctx.rotate(headA);
  drawHead(ctx, c, hr, pose, t, opts);
  ctx.restore();

  // 팔짱 (창가오)
  if (pose.hand === 'hide') {
    const y0 = tw(0, -toL * 0.62);
    const sl2 = sh(L.top, -0.05);
    seg(ctx, y0[0] - 7, y0[1] - 2, y0[0] + 9, y0[1] + 1, armW + 1.5, sl2);
    seg(ctx, y0[0] - 6, y0[1] + 3, y0[0] + 8, y0[1] - 2, armW + 1.5, L.top);
    circ(ctx, y0[0] + 9, y0[1] - 2, foreW * 0.7, skin);
    // 어깨
    seg(ctx, fSh[0], fSh[1], y0[0] + 6, y0[1] - 1, armW + 1.5, L.top);
  } else {
    drawArm(fSh, FA, true, pose.hand);
  }

  // 보드
  if (pose.board) {
    const by = 0 - 1;
    seg(ctx, -15, by - 2, 16, by - 2, 3, '#ff4fa3', false);
    ctx.fillStyle = OUT; ctx.fillRect(-16, by - 4, 33, 1);
    circ(ctx, -10, by + 1, 2, '#ffe066'); circ(ctx, 11, by + 1, 2, '#ffe066');
  }
  ctx.restore();
  return { hc, hr, top: hc[1] - hr };
}

function drawTorsoDetail(ctx, L, tw, cw, ww, toL, H, t) {
  const A = L.acc;
  const line = (pts, col, w) => { ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.beginPath(); ctx.moveTo(...tw(...pts[0])); for (let i = 1; i < pts.length; i++) ctx.lineTo(...tw(...pts[i])); ctx.stroke(); };
  switch (L.topStyle) {
    case 'hoodie':
      ctx.fillStyle = sh(L.top, -0.12);
      { const a = tw(cw * 0.05, -toL * 0.38), bb = tw(ww * 0.55, -toL * 0.38), c2 = tw(ww * 0.55, -4), d = tw(0, -4); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...bb); ctx.lineTo(...c2); ctx.lineTo(...d); ctx.fill(); }
      line([[cw * 0.25, -toL + 2], [cw * 0.3, -toL * 0.6]], '#fff', 0.8);
      line([[0, -2], [ww * 0.6, -2]], sh(L.top, -0.3), 2);
      break;
    case 'track':
      line([[cw * 0.42, -toL + 1], [ww * 0.45, -2]], '#e0e0e0', 1);
      line([[0, -2], [ww * 0.6, -2]], sh(L.top, -0.35), 2);
      break;
    case 'tank':
      ctx.fillStyle = L.skin;
      { const a = tw(-cw * 0.2, -toL - 2), bb = tw(cw * 0.45, -toL - 2), c2 = tw(cw * 0.3, -toL + 4); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...bb); ctx.lineTo(...c2); ctx.fill(); }
      line([[-ww, -1], [ww, -1]], sh(L.pants, -0.2), 3);
      break;
    case 'gi':
      line([[-cw * 0.1, -toL], [ww * 0.5, -toL * 0.35]], sh(L.top, -0.3), 1.2);
      line([[cw * 0.45, -toL + 1], [ww * 0.05, -toL * 0.35]], sh(L.top, -0.3), 1.2);
      line([[-cw * 0.1, -toL], [ww * 0.5, -toL * 0.35]], L.acc.giTrim || '#333', 0.6);
      break;
    case 'jacket':
      ctx.fillStyle = '#e8e8d8';
      { const a = tw(cw * 0.3, -toL), bb = tw(cw * 0.55, -toL), c2 = tw(ww * 0.6, -3), d = tw(ww * 0.35, -3); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...bb); ctx.lineTo(...c2); ctx.lineTo(...d); ctx.fill(); }
      line([[cw * 0.3, -toL], [ww * 0.35, -3]], sh(L.top, -0.35), 1);
      line([[-ww, -1.5], [ww, -1.5]], sh(L.pants, -0.1), 2.5);
      break;
    case 'coat':
      line([[cw * 0.35, -toL + 1], [ww * 0.2, -toL * 0.3], [ww * 0.45, -2]], sh(L.top, -0.4), 1.2);
      ctx.fillStyle = '#1b1b1b';
      { const a = tw(cw * 0.36, -toL + 1), bb = tw(cw * 0.55, -toL + 1), c2 = tw(ww * 0.5, -toL * 0.4); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...bb); ctx.lineTo(...c2); ctx.fill(); }
      line([[-cw * 0.2, -toL - 1], [-cw * 0.45, -toL - 5]], sh(L.top, 0.15), 2.5);
      break;
    case 'robe':
      line([[cw * 0.45, -toL + 1], [ww * 0.05, -toL * 0.4]], sh(L.top, -0.35), 1.2);
      break;
    case 'hackerHood': {
      const g = '#00e676';
      line([[cw * 0.1, -toL * 0.8], [cw * 0.35, -toL * 0.8], [cw * 0.35, -toL * 0.55]], g, 0.8);
      line([[-cw * 0.2, -toL * 0.4], [ww * 0.1, -toL * 0.4], [ww * 0.3, -toL * 0.25]], g, 0.8);
      line([[ww * 0.2, -toL * 0.65], [ww * 0.45, -toL * 0.65]], g, 0.8);
      ctx.fillStyle = (t >> 3) % 2 ? g : '#0a3';
      { const q = tw(cw * 0.36, -toL * 0.55); ctx.fillRect(q[0] - 0.8, q[1] - 0.8, 1.6, 1.6); }
      line([[0, -2], [ww * 0.6, -2]], '#000', 2);
      break;
    }
    case 'dragon':
      ctx.fillStyle = '#ffcc66';
      { const a = tw(cw * 0.15, -toL * 0.75), bb = tw(cw * 0.5, -toL * 0.75), c2 = tw(ww * 0.55, -4), d = tw(ww * 0.15, -4); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...bb); ctx.lineTo(...c2); ctx.lineTo(...d); ctx.fill(); }
      for (let i = 0; i < 4; i++) line([[ww * 0.2, -toL * (0.65 - i * 0.14)], [ww * 0.55, -toL * (0.65 - i * 0.14)]], '#d49a3a', 0.7);
      break;
    default: // tee
      line([[0, -1.5], [ww * 0.6, -1.5]], sh(L.pants, -0.2), 2.5);
      break;
  }
  if (L.topStyle === 'dragon') {
    // 등 가시
    ctx.fillStyle = '#ffcc33';
    for (let i = 0; i < 4; i++) {
      const p0 = tw(-cw * 0.5 - 0.5, -toL + 4 + i * 6), p1 = tw(-cw * 0.5 - 5, -toL + 6 + i * 6), p2 = tw(-cw * 0.5 + 0.5, -toL + 8 + i * 6);
      ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.lineTo(...p2); ctx.fill();
    }
  }
}

// 머리 (로컬 좌표: 중심 0,0 / 오른쪽 바라봄)
function drawHead(ctx, c, r, pose, t, opts) {
  const L = CHARS[c].look, A = L.acc, hair = L.hair;
  const rx = r * (A.roundFace ? 1.1 : 0.96), ry = r;
  // 후드 (머리 뒤)
  if (L.topStyle === 'hoodie' || L.topStyle === 'hackerHood') ell(ctx, -r * 0.7, r * 0.75, r * 0.65, r * 0.45, sh(L.top, -0.15));
  if (L.topStyle === 'dragon') ell(ctx, -r * 0.25, r * 0.1, rx * 1.15, r * 1.15, L.top);
  // 얼굴
  ell(ctx, 0, 0, rx, ry, L.skin);
  if (A.roundFace) ell(ctx, r * 0.45, r * 0.45, r * 0.5, r * 0.42, L.skin, false);
  // 턱 라인(근육질)
  if (L.b.muscle > 0.6) { ctx.fillStyle = L.skin; ctx.fillRect(r * 0.1, r * 0.3, r * 0.75, r * 0.6); ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(r * 0.85, r * 0.3); ctx.lineTo(r * 0.8, r * 0.9); ctx.lineTo(r * 0.1, r * 0.95); ctx.stroke(); }
  // 볼 음영
  ctx.fillStyle = sh(L.skin, -0.12); ctx.beginPath(); ctx.ellipse(-r * 0.35, r * 0.2, r * 0.45, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  // 귀
  ell(ctx, -r * 0.18, r * 0.08, r * 0.2, r * 0.26, sh(L.skin, -0.08));
  // 코
  ctx.fillStyle = L.skin; ctx.strokeStyle = OUT; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(rx * 0.92, -r * 0.08); ctx.lineTo(rx * 1.12, r * 0.22); ctx.lineTo(rx * 0.9, r * 0.28); ctx.fill(); ctx.stroke();

  // 눈
  const ex = r * 0.5, ey = -r * 0.08;
  if (pose.eyes === 'hurt' || pose.eyes === 'ko') {
    ctx.strokeStyle = OUT; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ex - 1.5, ey - 1.5); ctx.lineTo(ex + 1.5, ey + 1.5); ctx.moveTo(ex + 1.5, ey - 1.5); ctx.lineTo(ex - 1.5, ey + 1.5); ctx.stroke();
  } else if (pose.eyes === 'closed') {
    ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ex - 1.5, ey + 0.5); ctx.lineTo(ex + 1.8, ey + 0.5); ctx.stroke();
  } else if (pose.eyes === 'dizzy') {
    ctx.strokeStyle = OUT; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(ex, ey, 1.6, t * 0.3, t * 0.3 + 5); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.fillRect(ex - 1.5, ey - 1.2, 3.3, 2.6);
    ctx.fillStyle = '#111'; ctx.fillRect(ex + 0.4, ey - 1, 1.5, 2.4);
  }
  // 눈썹
  ctx.strokeStyle = hair.color; ctx.lineWidth = 1.2;
  const angry = pose.mouth === 'shout' ? 0.9 : 0;
  ctx.beginPath(); ctx.moveTo(ex - 2, ey - 3 - angry * 0.5); ctx.lineTo(ex + 2.4, ey - 2.4 + angry * 0.8); ctx.stroke();

  // 입
  const mx = r * 0.66, my = r * 0.5;
  drawMouth(ctx, L, A, pose, mx, my, r, t);

  // 머리카락
  drawHair(ctx, L, hair, r, rx, t);

  // 악세서리
  if (A.glasses) {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(170,220,255,0.35)';
    ctx.fillRect(r * 0.2, -r * 0.36, r * 0.72, r * 0.5); ctx.strokeRect(r * 0.2, -r * 0.36, r * 0.72, r * 0.5);
    ctx.beginPath(); ctx.moveTo(r * 0.2, -r * 0.2); ctx.lineTo(-r * 0.18, -r * 0.08); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(r * 0.72, -r * 0.3, 1, 1);
  }
  if (A.sunglasses) {
    ctx.fillStyle = '#0b0b10'; ctx.fillRect(r * 0.12, -r * 0.38, r * 0.92, r * 0.5);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(r * 0.12, -r * 0.25); ctx.lineTo(-r * 0.2, -r * 0.12); ctx.stroke();
    // 반짝
    const g = (t % 90) / 90;
    ctx.fillStyle = '#e8d0ff'; ctx.fillRect(r * 0.15 + g * r * 0.8, -r * 0.34, 1.2, 1.2);
    ctx.fillStyle = 'rgba(200,150,255,0.6)'; ctx.fillRect(r * 0.3, -r * 0.32, r * 0.25, 0.8);
  }
  if (A.visor) {
    ctx.fillStyle = 'rgba(0,255,140,0.55)'; ctx.fillRect(r * 0.05, -r * 0.4, r * 1.05, r * 0.42);
    ctx.fillStyle = '#00ff99'; ctx.fillRect(r * 0.05, -r * 0.42, r * 1.05, 0.8);
    ctx.fillStyle = '#eafff3'; ctx.fillRect(r * 0.2 + ((t >> 2) % 8), -r * 0.3, 1, 1);
  }
  if (A.headband) {
    ctx.fillStyle = A.headband; ctx.fillRect(-r * 0.85, -r * 0.55, r * 1.75, 2.2);
    const w = Math.sin(t * 0.25) * 2;
    seg(ctx, -r * 0.85, -r * 0.45, -r * 1.6, -r * 0.1 + w, 1.6, A.headband, false);
    seg(ctx, -r * 0.85, -r * 0.4, -r * 1.4, r * 0.25 + w, 1.6, A.headband, false);
  }
  if (A.strawHat) {
    poly(ctx, [[-r * 1.6, -r * 0.62], [r * 1.6, -r * 0.62], [r * 0.1, -r * 1.75]], '#e6c26e');
    ctx.strokeStyle = '#b8913a'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(-r * 0.8, -r * 0.65); ctx.lineTo(r * 0.05, -r * 1.6); ctx.moveTo(r * 0.8, -r * 0.65); ctx.lineTo(r * 0.15, -r * 1.6); ctx.stroke();
  }
  if (A.capBack) {
    ell(ctx, -r * 0.05, -r * 0.55, r * 1.0, r * 0.55, A.capBack);
    ctx.fillStyle = OUT; ctx.fillRect(-r * 1.55, -r * 0.62, r * 0.75, 2.2);
    ctx.fillStyle = A.capBack; ctx.fillRect(-r * 1.5, -r * 0.6, r * 0.65, 1.2);
    ctx.fillStyle = '#ff007f'; ctx.fillRect(-r * 0.2, -r * 0.95, 2, 2);
  }
  if (A.horns || L.topStyle === 'dragon') {
    // 드래곤 후드: 머리 윗부분/뒤를 덮음
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-3 * r, 1.2 * r); ctx.lineTo(-0.7 * r, 1.2 * r); ctx.lineTo(0.15 * r, -0.42 * r); ctx.lineTo(3 * r, -0.5 * r); ctx.lineTo(3 * r, -4 * r); ctx.lineTo(-3 * r, -4 * r); ctx.closePath(); ctx.clip();
    ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(-r * 0.05, -r * 0.05, rx * 1.2, r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = L.top; ctx.beginPath(); ctx.ellipse(-r * 0.05, -r * 0.05, rx * 1.12, r * 1.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = sh(L.top, 0.2); ctx.fillRect(-r * 0.4, -r * 0.95, r * 0.6, 1.2);
    poly(ctx, [[-r * 0.5, -r * 0.85], [-r * 1.2, -r * 1.9], [-r * 0.05, -r * 1.0]], '#ffe8b0');
    poly(ctx, [[r * 0.1, -r * 0.95], [r * 0.2, -r * 2.0], [r * 0.6, -r * 0.8]], '#fff2cc');
    ctx.fillStyle = '#ffcc33'; ctx.fillRect(r * 0.6, -r * 0.7, 2, 1.4);
  }
}

function drawMouth(ctx, L, A, pose, mx, my, r, t) {
  const m = pose.mouth;
  if (A.lips) {
    ell(ctx, mx, my - 0.6, r * 0.32, r * 0.14, '#d9707a', true);
    ell(ctx, mx, my + 1.2, r * 0.34, r * 0.17, '#c95c68', false);
    if (m === 'shout' || m === 'open') { ctx.fillStyle = '#3a0d12'; ctx.fillRect(mx - r * 0.18, my - 0.2, r * 0.36, 1.6); }
    return;
  }
  if (m === 'shout' || m === 'open' || A.braces || A.yellowTeeth) {
    const open = m === 'shout' || m === 'open';
    const w = r * 0.42, h = open ? r * 0.32 : r * 0.16;
    ctx.fillStyle = OUT; ctx.fillRect(mx - w / 2 - 0.5, my - h / 2 - 0.5, w + 1, h + 1);
    ctx.fillStyle = open ? '#4a1018' : '#000'; ctx.fillRect(mx - w / 2, my - h / 2, w, h);
    if (A.braces) {
      ctx.fillStyle = '#fff'; ctx.fillRect(mx - w / 2, my - h / 2, w, Math.min(h, 1.8));
      ctx.fillStyle = '#9aa4b0'; ctx.fillRect(mx - w / 2, my - h / 2 + 0.6, w, 0.7);
      ctx.fillStyle = '#d6dde6'; for (let i = 0; i < 3; i++) ctx.fillRect(mx - w / 2 + 0.3 + i * (w / 3), my - h / 2 + 0.3, 0.9, 0.9);
    } else if (A.yellowTeeth) {
      ctx.fillStyle = '#d8c34a'; ctx.fillRect(mx - w / 2, my - h / 2, w, Math.min(h, 1.8));
      ctx.fillStyle = '#7a6a1a'; ctx.fillRect(mx - w / 2 + 1, my - h / 2, 0.8, 1.6);
    } else if (open) {
      ctx.fillStyle = '#fff'; ctx.fillRect(mx - w / 2, my - h / 2, w, 1);
    }
  } else if (m === 'smirk') {
    ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(mx - 2, my + 0.5); ctx.lineTo(mx + 1, my + 0.5); ctx.lineTo(mx + 2.5, my - 1); ctx.stroke();
  } else if (m === 'smile') {
    ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(mx, my - 1, 2.2, 0.2, Math.PI - 0.2); ctx.stroke();
  } else {
    ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(mx - 1.8, my); ctx.lineTo(mx + 1.8, my); ctx.stroke();
  }
}

function drawHair(ctx, L, hair, r, rx, t) {
  const col = hair.color, hl = sh(col, 0.25);
  // 얼굴을 가리지 않도록 (앞 이마선 frontY ~ 뒤 목덜미 backY) 위쪽만 칠함
  const capFill = (scale, frontY, backY, color, dx, dy) => {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-3 * r, backY * r); ctx.lineTo(-0.9 * r, backY * r); ctx.lineTo(0.05 * r, frontY * r); ctx.lineTo(3 * r, frontY * r); ctx.lineTo(3 * r, -4 * r); ctx.lineTo(-3 * r, -4 * r); ctx.closePath(); ctx.clip();
    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(dx || 0, dy || 0, rx * scale, r * scale, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
  const cap = (scale, fy, by, dx, dy) => { capFill(scale + 0.1, fy - 0.08, by + 0.05, OUT, dx, dy); capFill(scale, fy, by, col, dx, dy); };
  switch (hair.style) {
    case 'spiky': {
      // 뾰족한 머리 (힌참휴)
      const spikes = [[-1.0, 0.1, -2.1, -0.4], [-0.75, -0.55, -1.75, -1.6], [-0.3, -0.85, -0.85, -2.4], [0.15, -0.95, 0.15, -2.6], [0.55, -0.8, 1.2, -2.05], [0.85, -0.45, 1.7, -1.1]];
      ctx.fillStyle = OUT;
      for (const s of spikes) { ctx.beginPath(); ctx.moveTo(s[0] * r - 3.2, s[1] * r + 1.5); ctx.lineTo(s[2] * r, s[3] * r - 0.8); ctx.lineTo(s[0] * r + 3.2, s[1] * r + 1.5); ctx.fill(); }
      cap(1.06, -0.5, 0.45);
      ctx.fillStyle = col;
      for (const s of spikes) { ctx.beginPath(); ctx.moveTo(s[0] * r - 2.2, s[1] * r + 1.5); ctx.lineTo(s[2] * r * 0.96, s[3] * r * 0.96); ctx.lineTo(s[0] * r + 2.2, s[1] * r + 1.5); ctx.fill(); }
      ctx.fillStyle = '#00e676';
      ctx.fillRect(spikes[3][2] * r - 0.5, spikes[3][3] * r + 1.5, 1, 2);
      ctx.fillRect(spikes[2][2] * r, spikes[2][3] * r + 1.5, 1, 2);
      break;
    }
    case 'buzz': capFill(1.03, -0.55, 0.3, col); break;
    case 'crew': cap(1.05, -0.6, 0.35); break;
    case 'slick':
      cap(1.07, -0.55, 0.65, -1);
      ctx.strokeStyle = hl; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(-1, 0, r * 0.85, Math.PI * 1.25, Math.PI * 1.7); ctx.stroke();
      break;
    case 'bowl':
      cap(1.1, -0.32, 0.55, 0, -0.3);
      ctx.strokeStyle = hl; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(0, 0, r * 0.8, Math.PI * 1.3, Math.PI * 1.7); ctx.stroke();
      break;
    case 'topknot':
      cap(1.05, -0.55, 0.4);
      circ(ctx, -r * 0.35, -r * 1.15, r * 0.35, col);
      break;
    case 'messy':
    case 'shaggy': {
      cap(1.1, hair.style === 'shaggy' ? -0.38 : -0.5, hair.style === 'shaggy' ? 0.95 : 0.5);
      ctx.fillStyle = col;
      for (let i = 0; i < 6; i++) {
        const a = Math.PI * (1.05 + i * 0.16);
        const x = Math.cos(a) * rx * 1.05, y = Math.sin(a) * r * 1.05;
        ctx.beginPath(); ctx.moveTo(x - 2, y + 1); ctx.lineTo(x + Math.cos(a) * 3 + (i % 2), y + Math.sin(a) * 3); ctx.lineTo(x + 2, y + 1); ctx.fill();
      }
      break;
    }
    case 'parted':
      cap(1.06, -0.5, 0.45);
      ctx.strokeStyle = hl; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(-r * 0.1, -r * 1.0); ctx.lineTo(r * 0.55, -r * 0.6); ctx.stroke();
      break;
    default: // short
      cap(1.06, -0.52, 0.45);
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(r * 0.1, -r * 0.95); ctx.lineTo(r * 0.95, -r * 0.5); ctx.lineTo(r * 0.3, -r * 0.55); ctx.fill();
      ctx.strokeStyle = hl; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(0, 0, r * 0.85, Math.PI * 1.3, Math.PI * 1.65); ctx.stroke();
      break;
  }
}

// ---------- 초상화 (머리만) ----------
function drawPortrait(ctx, c, x, y, scale, facing, mood, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * (facing || 1), scale);
  const pose = P({ eyes: mood === 'hurt' ? 'hurt' : 'n', mouth: mood === 'hurt' ? 'open' : mood === 'win' ? 'smile' : 'n' });
  const L = CHARS[c].look;
  if (L.acc.chinUp) pose.tilt = -0.1;
  drawHead(ctx, c, CHARS[c].look.b.headR, pose, t || 0, {});
  ctx.restore();
}

// ---- 21_stages.js ----
// ============================================================
//  나라별 스테이지 배경 (절차적 도트 일러스트 + 패럴랙스)
// ============================================================
const FT = 212;                                   // 바닥이 시작되는 y
const PAR_FAR = 0.25, PAR_MID = 0.6, PAR_CROWD = 0.85;
const W_FAR = Math.ceil(VW + (ARENA_W - VW) * PAR_FAR), W_MID = Math.ceil(VW + (ARENA_W - VW) * PAR_MID);

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function vgrad(g, x, y, w, h, stops) {
  const gr = g.createLinearGradient(0, y, 0, y + h);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  g.fillStyle = gr; g.fillRect(x, y, w, h);
}
function starsG(g, w, h, n, R, col) { for (let i = 0; i < n; i++) { g.fillStyle = col || (R() < 0.3 ? '#fff' : '#9ab'); g.fillRect(Math.floor(R() * w), Math.floor(R() * h), 1, 1); } }
function ridge(g, w, base, amp, col, R, f1, f2) {
  const p1 = R() * 10, p2 = R() * 10;
  g.fillStyle = col; g.beginPath(); g.moveTo(0, FT + 5);
  for (let x = 0; x <= w; x += 2) g.lineTo(x, base - amp * (0.55 * Math.sin(x * f1 + p1) + 0.35 * Math.sin(x * f2 + p2) + 0.4));
  g.lineTo(w, FT + 5); g.closePath(); g.fill();
}
function cloud(g, x, y, s, col) {
  g.fillStyle = col;
  for (const [dx, dy, r] of [[0, 0, 7], [8, -4, 8], [17, 0, 7], [9, 3, 7], [-7, 3, 5], [24, 3, 5]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); g.fill(); }
}
function windows(g, x, y, w, h, R, lit, dark, step) {
  step = step || 4;
  for (let yy = y + 3; yy < y + h - 3; yy += step + 1) for (let xx = x + 2; xx < x + w - 3; xx += step) {
    g.fillStyle = R() < 0.45 ? lit[Math.floor(R() * lit.length)] : dark;
    g.fillRect(xx, yy, 2, 2);
  }
}
function palm(g, x, y, h, col, leaf) {
  g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 6, y - h * 0.5, x + 3, y - h); g.stroke();
  g.strokeStyle = leaf; g.lineWidth = 2.5;
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * 0.55;
    g.beginPath(); g.moveTo(x + 3, y - h);
    g.quadraticCurveTo(x + 3 + Math.cos(a) * 12, y - h + Math.sin(a) * 6 - 4, x + 3 + Math.cos(a) * 20, y - h + 8 + Math.abs(Math.cos(a)) * 4);
    g.stroke();
  }
}
function cypress(g, x, y, h, col) { g.fillStyle = col; g.beginPath(); g.ellipse(x, y - h / 2, h * 0.14, h / 2, 0, 0, Math.PI * 2); g.fill(); }
function floorBase(g, top, bot) { vgrad(g, 0, FT, ARENA_W, VH - FT, [[0, top], [1, bot]]); }
function perspLines(g, col, n, vy) {
  g.strokeStyle = col; g.lineWidth = 1;
  for (let i = -n; i <= n * 2; i++) {
    const xb = i * (ARENA_W / n);
    const xt = ARENA_W / 2 + (xb - ARENA_W / 2) * 0.55;
    g.beginPath(); g.moveTo(xt, FT); g.lineTo(xb, VH); g.stroke();
  }
  if (vy) for (const y of vy) { g.beginPath(); g.moveTo(0, y); g.lineTo(ARENA_W, y); g.stroke(); }
}

// 국기
function drawFlag(g, code, x, y, w, h) {
  g.save(); g.translate(x, y);
  const r = (c, a, b, cc, d) => { g.fillStyle = c; g.fillRect(a, b, cc, d); };
  switch (code) {
    case 'KR': {
      r('#fff', 0, 0, w, h);
      const cx = w / 2, cy = h / 2, rr = h * 0.25;
      g.fillStyle = '#c60c30'; g.beginPath(); g.arc(cx, cy, rr, Math.PI, 0); g.fill();
      g.fillStyle = '#003478'; g.beginPath(); g.arc(cx, cy, rr, 0, Math.PI); g.fill();
      g.fillStyle = '#c60c30'; g.beginPath(); g.arc(cx - rr / 2, cy, rr / 2, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#003478'; g.beginPath(); g.arc(cx + rr / 2, cy, rr / 2, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#000';
      for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) for (let k = 0; k < 3; k++) g.fillRect(cx + dx * w * 0.32 - w * 0.06, cy + dy * h * 0.3 - 2 + k * 1.6, w * 0.12, 0.9);
      break;
    }
    case 'FR': r('#0055a4', 0, 0, w / 3, h); r('#fff', w / 3, 0, w / 3, h); r('#ef4135', 2 * w / 3, 0, w / 3 + 0.5, h); break;
    case 'IT': r('#009246', 0, 0, w / 3, h); r('#fff', w / 3, 0, w / 3, h); r('#ce2b37', 2 * w / 3, 0, w / 3 + 0.5, h); break;
    case 'VN': r('#da251d', 0, 0, w, h); star(g, w / 2, h / 2, h * 0.3, '#ffcd00'); break;
    case 'CN': r('#de2910', 0, 0, w, h); star(g, w * 0.17, h * 0.27, h * 0.17, '#ffde00'); for (const [a, b] of [[0.33, 0.1], [0.4, 0.2], [0.4, 0.35], [0.33, 0.45]]) star(g, w * a, h * b, h * 0.06, '#ffde00'); break;
    case 'BR':
      r('#009c3b', 0, 0, w, h);
      g.fillStyle = '#ffdf00'; g.beginPath(); g.moveTo(w * 0.08, h / 2); g.lineTo(w / 2, h * 0.1); g.lineTo(w * 0.92, h / 2); g.lineTo(w / 2, h * 0.9); g.fill();
      g.fillStyle = '#002776'; g.beginPath(); g.arc(w / 2, h / 2, h * 0.24, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.fillRect(w / 2 - h * 0.24, h / 2 - 0.4, h * 0.48, 0.9);
      break;
    case 'EG':
      r('#ce1126', 0, 0, w, h / 3); r('#fff', 0, h / 3, w, h / 3); r('#000', 0, 2 * h / 3, w, h / 3 + 0.5);
      g.fillStyle = '#c09300'; g.fillRect(w / 2 - 1.5, h / 2 - 1.5, 3, 3);
      break;
    case 'US':
      for (let i = 0; i < 7; i++) r(i % 2 ? '#fff' : '#b22234', 0, (i * h) / 7, w, h / 7 + 0.5);
      r('#3c3b6e', 0, 0, w * 0.42, h * 0.54);
      g.fillStyle = '#fff'; for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) g.fillRect(2 + j * w * 0.1, 1.5 + i * h * 0.16, 1, 1);
      break;
    case 'IN':
      r('#ff9933', 0, 0, w, h / 3); r('#fff', 0, h / 3, w, h / 3); r('#138808', 0, 2 * h / 3, w, h / 3 + 0.5);
      g.strokeStyle = '#000080'; g.lineWidth = 0.8; g.beginPath(); g.arc(w / 2, h / 2, h * 0.13, 0, Math.PI * 2); g.stroke();
      break;
    case 'ES': r('#aa151b', 0, 0, w, h); r('#f1bf00', 0, h / 4, w, h / 2); g.fillStyle = '#aa151b'; g.fillRect(w * 0.25, h * 0.38, w * 0.1, h * 0.24); break;
    case 'JP': r('#fff', 0, 0, w, h); g.fillStyle = '#bc002d'; g.beginPath(); g.arc(w / 2, h / 2, h * 0.3, 0, Math.PI * 2); g.fill(); break;
    default: r('#888', 0, 0, w, h);
  }
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1; g.strokeRect(0, 0, w, h);
  g.restore();
}
function star(g, x, y, r, col) {
  g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}

// 관중 (애니메이션)
function crowdSpec(seed, n, palette, y0) {
  const R = mulberry32(seed), out = [];
  for (let i = 0; i < n; i++) out.push({ x: 10 + R() * (ARENA_W - 20), y: y0 + R() * 6, c: palette[Math.floor(R() * palette.length)], h: 9 + R() * 4, ph: R() * 6, arm: R() < 0.5, sk: R() < 0.5 ? '#d8a878' : '#8d5a3b' });
  return out.sort((a, b) => a.y - b.y);
}
function drawCrowd(ctx, spec, t, cx, hype) {
  for (const p of spec) {
    const x = Math.round(p.x - cx * PAR_CROWD);
    if (x < -10 || x > VW + 10) continue;
    const b = Math.max(0, Math.sin(t * (0.12 + hype * 0.1) + p.ph)) * (1.5 + hype * 2);
    const y = Math.round(p.y - b);
    ctx.fillStyle = p.c; ctx.fillRect(x - 3, y - p.h, 7, p.h);
    ctx.fillStyle = p.sk; ctx.fillRect(x - 2, y - p.h - 5, 5, 5);
    if (p.arm) { ctx.fillStyle = p.c; ctx.fillRect(x + 3, y - p.h - 6 - b, 2, 7); }
  }
}
